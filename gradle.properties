# Centralized dependency & plugin versions for ALL modules.
# Root gradle.properties values propagate to every subproject, so each version lives
# here once. Plugin versions are consumed by settings.gradle (pluginManagement); library
# versions are referenced in module build.gradle files as ${pulsarVersion} etc.

# --- Gradle plugins ---
springBootVersion=4.1.0
dependencyManagementVersion=1.1.7

# --- Version ---
# One version for the whole platform: every module, the service jars attached to a GitHub
# Release, the About dialog's version readout, and the Java SDK and api-model published to Maven
# Central. A vX.Y.Z release publishes them all together (.github/workflows/release.yml). Gradle
# applies `version` from this file to every project; override it with -Pversion=X.Y.Z.
version=1.1.0-SNAPSHOT

# --- Shared library versions ---
# Pulsar CLIENT libraries (pulsar-client, -admin) in every service. Held on 4.x: the 5.0.0 client's
# logging library (io.github.merlimat.slog 0.10.0) picks its log4j2 backend whenever the log4j API is
# present and then needs log4j-core, so it crashes under logback + log4j-to-slf4j (Spring Boot's
# default) on the first Avro schema. v4 clients are supported against 5.0 brokers.
pulsarVersion=4.0.11
# Pulsar BROKER: what the entry-filter NAR compiles against and the image local dev and the
# integration tests run. Must match the brokers the NAR is deployed to.
pulsarBrokerVersion=5.0.0
# xxHash for node/external ids. Pinned centrally because the ids it produces are PERSISTED:
# every module must hash identically, and a version that changed the algorithm would orphan
# existing rows. Also published as an api dependency of datahub-api-model, so it must be a
# stable release, not the 0.27ea0 early-access build it replaced.
zeroAllocHashingVersion=2026.0
# Parser generator for the events filter expression language (datahub-commons).
# The `antlr` plugin ships with Gradle itself, so only the library version lives here.
antlrVersion=4.13.2
jacksonVersion=3.1.4
feignVersion=13.6
anthropicSdkVersion=2.52.0
