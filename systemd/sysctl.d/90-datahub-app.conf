# DataHub Platform: kernel tuning for the application hosts
#
# Install as /etc/sysctl.d/90-datahub-app.conf and apply with "sysctl --system". For app
# hosts running one JVM per NUMA node. The load balancer has its own file, see
# nginx/sysctl.d.
#
# Deliberately short: these are the settings that are actually wrong for THIS setup, not
# general server hardening. Kernel defaults are fine for everything else here.

# The units bind each JVM to one node (NUMAPolicy=bind, systemd/datahub@*.service.d).
# Automatic NUMA balancing (on by default) would then just add page-migration overhead
# fighting a placement that is already fixed, never actually rebalancing anything. This
# is host-wide, not scoped to those units: it assumes the whole box is dedicated to the
# pinned JVMs. If something else unpinned also runs here, it loses the kernel's own
# balancing too, a performance regression for that process, not a correctness issue.
kernel.numa_balancing = 0

# A pre-touched, pinned heap (AlwaysPreTouch, systemd/env/*.env) is deliberately meant to
# never move or page out. Default swappiness (60) lets the kernel swap that memory out
# under any unrelated pressure elsewhere on the host, undoing the whole point of pinning
# it. Swap only as an absolute last resort.
vm.swappiness = 1

# The kernel's own default (about 65530) is sized for a desktop, not a host running
# several JVMs: G1's region-per-mmap layout plus thread stacks can hit it, and the JVM
# then fails to start with "Cannot allocate memory" rather than a clear error about this
# limit. Recent systemd (255+, e.g. Debian 13) already ships a higher default of its own
# via /usr/lib/sysctl.d/50-default.conf; since /etc/sysctl.d files apply after /usr/lib's
# in the same numeric slot (90 after 50), setting anything lower here would undo that
# default rather than raise it. Match it, so this line is a no-op where systemd already
# covers it and the actual fix on hosts (older systemd, e.g. current AlmaLinux 9) that
# still ship the low kernel default.
vm.max_map_count = 1048576

# Every request opens a fresh connection to the pgbouncer on localhost (there is no
# app-side pool by design, see AGENTS.md); at real request rates that is enough
# connection churn to a single destination to matter for ephemeral port turnover.
# Reusing a TIME_WAIT socket for a new outbound connection is safe once tcp_timestamps
# is on (the kernel default), and this is exactly the safe case it exists for: loopback,
# not the public internet.
net.ipv4.tcp_tw_reuse = 1
