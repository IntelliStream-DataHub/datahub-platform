# /etc/systemd/system/datahub@stateless-consumer.service.d/placement.conf
#
# Host placement for datahub@stateless-consumer on a dual-socket server. One service per NUMA node:
# memory and CPU both come from node 0, so every heap access is local and the two
# services on a host never contend for the same cores or memory controller.
#
# CPUAffinity=numa derives the CPU set from NUMAMask, so this file needs no CPU numbers;
# check the node layout with "lscpu | grep NUMA" or "numactl -H". With NUMAPolicy=bind an
# allocation beyond the node's own memory fails instead of spilling to the other node,
# which is the point; MemoryMax below stops the service long before that.
#
# Alternatives: AllowedCPUs=/AllowedMemoryNodes= (cgroup v2 cpuset) pin the whole cgroup
# rather than the process and are inherited by anything it spawns.
[Service]
NUMAPolicy=bind
NUMAMask=0
CPUAffinity=numa

# Guard rail, not a target: heap + direct buffers + metaspace + code cache + thread
# stacks for the JAVA_OPTS in /etc/datahub/stateless-consumer.env land well under this. If it is hit,
# something leaked and a restart beats swapping.
MemoryMax=40G

