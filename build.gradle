
tasks.register('startBootStack') {
    dependsOn ':datahub-api:bootRun',
            ':datahub-stateless-consumer:bootRun',
            ':datahub-analysis:bootRun',
            ':datahub-flow:bootRun',
            ':datahub-console:bootRun'
}

gradle.projectsEvaluated {
    startBootStack.configure {
        doLast {
            logger.lifecycle('All projects are started')
        }
    }
}

gradle.startParameter.setParallelProjectExecutionEnabled(true)

// ---------------------------------------------------------------------------
// Guard the Keycloak realm import. Keycloak stores CLIENT/ORGANIZATION.DESCRIPTION as
// VARCHAR(255); a longer value makes `start-dev --import-realm` abort, and the whole
// compose stack then fails to boot. This has regressed repeatedly, silently, because the
// only symptom is a crashed Keycloak. Fail the build early with an exact pointer instead.
// ---------------------------------------------------------------------------
tasks.register('validateKeycloakRealm') {
    group = 'verification'
    description = 'Fail if any Keycloak realm description exceeds 255 chars (aborts realm import).'
    def realmFile = file('deploy/keycloak/datahub-realm.json')
    inputs.file(realmFile)
    doLast {
        final int LIMIT = 255
        def realm = new groovy.json.JsonSlurper().parse(realmFile)
        def problems = []
        def check = { kind, name, text ->
            if (text != null && text.length() > LIMIT) {
                problems << "  ${kind} '${name}': description is ${text.length()} chars (> ${LIMIT})"
            }
        }
        realm.clients?.each { check('client', it.clientId, it.description) }
        realm.organizations?.each { check('organization', it.alias, it.description) }
        if (problems) {
            throw new GradleException(
                "Keycloak stores DESCRIPTION as VARCHAR(255); these exceed it and will abort\n" +
                "realm import, so the whole compose stack fails to boot:\n" +
                problems.join('\n') +
                "\nShorten them in ${realmFile}.")
        }
    }
}

// Run the realm check as part of the normal build/check, so a regression fails CI.
subprojects {
    tasks.matching { it.name == 'check' }.configureEach {
        dependsOn rootProject.tasks.named('validateKeycloakRealm')
    }
}

// ---------------------------------------------------------------------------
// Maven Central release bundle.
//
// The Central Portal takes a single zip laid out as a Maven repository and validates it
// as one deployment, so the two published modules (datahub-api-model and datahub-sdk,
// released in lockstep) stage into ONE shared directory and ship as ONE bundle. Gradle
// does not upload: that is a separate manual step, deliberately, so nothing reaches a
// permanent, undeletable Central release by accident.
// ---------------------------------------------------------------------------
def centralPublishTasks = [
        ':datahub-api-model:publishMavenJavaPublicationToCentralStagingRepository',
        ':datahub-java-sdk:publishMavenJavaPublicationToCentralStagingRepository',
]

// Wipe the staging dir first: it is keyed by version, so without this a re-run after a
// version bump would ship the previous version's files alongside the new ones.
tasks.register('clearCentralStaging', Delete) {
    delete layout.buildDirectory.dir('central-staging')
}

subprojects {
    tasks.matching { it.name == 'publishMavenJavaPublicationToCentralStagingRepository' }
            .configureEach { dependsOn rootProject.tasks.named('clearCentralStaging') }
}

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Stage datahub-api-model + datahub-sdk and zip the Maven Central deployment bundle.'
    dependsOn centralPublishTasks

    def stagingDir = layout.buildDirectory.dir('central-staging')
    from stagingDir
    // Gradle writes no maven-metadata.xml for releases, but exclude it defensively: the
    // Portal rejects a bundle carrying files it did not expect.
    exclude '**/maven-metadata*'

    archiveFileName = "datahub-central-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir('central')

    // Central rejects an unsigned deployment, and the Sign tasks skip silently when no key
    // is configured. Fail here instead, where the fix is obvious.
    doFirst {
        def jars = fileTree(stagingDir) { include '**/*.jar', '**/*.pom' }.files
        def unsigned = jars.findAll { !new File(it.path + '.asc').exists() }
        if (unsigned) {
            throw new GradleException(
                    "Maven Central requires a PGP signature for every published file; these have none:\n" +
                    unsigned.collect { "  ${it.name}" }.join('\n') +
                    "\nConfigure a signing key (-PsigningKey / SIGNING_KEY, or " +
                    "-PsigningUseGpgCommand=true).")
        }
    }
}

// ---------------------------------------------------------------------------
// Fat jars in the root build directory.
//
// Each Spring Boot application builds its executable jar under that module's
// build/libs. `./gradlew assemble` also runs this root task, which copies the
// enabled boot jars into the root build/ so one directory holds every runnable
// jar. Library modules disable bootJar; their plain jars stay put.
// The tracked outputs are the jar files themselves, not the build directory:
// a Copy task would claim the whole directory and then treat reports and the
// Central bundle as its own outputs.
// ---------------------------------------------------------------------------
def rootAssemble = tasks.register('assemble') {
    group = 'build'
    description = 'Copy each runnable Spring Boot fat jar into the root build directory.'
}

gradle.projectsEvaluated {
    def bootJars = subprojects.collect { it.tasks.findByName('bootJar') }
            .findAll { it != null && it.enabled }
    def destDir = layout.buildDirectory
    def sources = bootJars.collect { it.archiveFile }

    rootAssemble.configure {
        dependsOn bootJars
        inputs.files(sources)
        outputs.files(sources.collect { source ->
            destDir.file(source.get().asFile.name)
        })

        doLast {
            def dest = destDir.get().asFile
            dest.mkdirs()
            def names = []
            sources.each { source ->
                def src = source.get().asFile
                java.nio.file.Files.copy(
                        src.toPath(),
                        dest.toPath().resolve(src.name),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                names << src.name
            }
            logger.lifecycle("Copied fat jars to ${dest}: ${names.sort().join(', ')}")
        }
    }
}
