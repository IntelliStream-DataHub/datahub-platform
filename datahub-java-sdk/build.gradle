// datahub-java-sdk — JDK-HttpClient Java client for the DataHub Platform REST API.
//
// External/third-party facing. Depends only on datahub-api-model (the lean wire
// contract) plus Jackson 3 for (de)serialization — no server stack. Published as
// ai.intellistream:datahub-sdk so out-of-tree consumers can resolve it.
//
// As with datahub-api-model / datahub-commons, the Spring Boot plugins are applied
// ONLY for the shared dependency BOM (version management); they add no Spring code to
// the artifact, and bootJar is disabled because this is a library.

plugins {
    id 'ai.intellistream.datahub.java-library-conventions'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'ai.intellistream.datahub.maven-central-conventions'
}

dependencies {
    // Shared wire-contract types (DataWrapper, Resource, Timeseries, datapoint/subscription
    // DTOs, …). `api` because they appear on the SDK's public method signatures; brings
    // Jackson 3, jakarta-validation, swagger-annotations, openhft and slf4j transitively.
    api project(':datahub-api-model')

    // Jackson 3 mapper — the SDK uses it directly to (de)serialize the wire types.
    implementation "tools.jackson.core:jackson-databind:${jacksonVersion}"

    // zstd for the binary datapoint frames (compression is mandatory on that path and the JDK
    // has no zstd). api-model's ZstdPayloadCodec compiles against it but does not carry it.
    implementation 'com.github.luben:zstd-jni:1.5.7-20'

    // The SDK's own warnings (spooled data dropped or unreadable) go to the caller's logging
    // backend. api-model already brings slf4j-api; declared here because the SDK uses it directly.
    implementation 'org.slf4j:slf4j-api'

    // JUnit (version managed by the Spring Boot BOM) is supplied by java-common-conventions.
}

// Library module: no main class, so don't build an executable boot jar.
bootJar { enabled = false }
jar { enabled = true; archiveClassifier = '' }

// --- Publishing -----------------------------------------------------------------
// Published to Maven Central as ai.intellistream:datahub-sdk, in lockstep with the
// model. The group, licence/scm/developer POM metadata, sources+javadoc jars, the
// LICENSE inside each jar, signing and the staging repository all come from the
// maven-central-conventions plugin; `./gradlew centralBundle` builds the deployment.
version = providers.gradleProperty('javaSdkVersion').getOrElse('0.3.0-SNAPSHOT')

publishing.publications.mavenJava {
    // The Maven coordinate is datahub-sdk, not the Gradle project name datahub-java-sdk —
    // that is what the SDK docs tell consumers to depend on. Do not let it default.
    artifactId = 'datahub-sdk'
    pom {
        name = 'DataHub SDK'
        description = 'Java client for the DataHub Platform REST API.'
    }
}
