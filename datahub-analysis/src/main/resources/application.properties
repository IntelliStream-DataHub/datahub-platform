# Timeseries relationship-analysis service — stateless, no DB. OAuth2 resource server: it validates
# the user JWT the browser presents to /analysis (see SecurityConfig) and forwards it to the api when
# gathering data. The issuer-uri is loaded from Vault at startup (VaultConfigurationLoader) from the
# shared "datahub-platform" secret, so the Vault connection (vault.address/role-id/secret-id) is
# supplied per-profile — see application-dev.properties / application-prod.properties. Run with
# SPRING_PROFILES_ACTIVE=dev|prod.
spring.application.name=datahub-analysis
server.port=8082
# Prometheus scrape endpoint, on a port of its own so the load balancer never reaches it.
#
# OFF by default. The scrape is unauthenticated, so whatever can reach the port reads request
# rates, error rates, the endpoint inventory and JVM internals. Turn it on only once the port is
# reachable from the Prometheus host alone. Prefer mutual TLS over trusting the firewall: set
# `metrics.keystore` and `metrics.truststore` (with their passwords) in the shared Vault secret and
# `management.server.ssl.*` is configured from them at startup, so only a Prometheus holding a certificate you
# issued can scrape. With no keystore in Vault the port stays plain HTTP.
# Read the security guidance first:
# https://intellistream.ai/data-platform-documentation/administration/monitoring#securing-the-endpoint
management.server.port=9082
# management.server.address=10.0.0.5   # narrow from the wildcard to an internal interface
# Add `prometheus` to serve /actuator/prometheus.
management.endpoints.web.exposure.include=
management.health.defaults.enabled=false
# For the tomcat_connections and tomcat_threads metrics.
server.tomcat.mbeanregistry.enabled=true

# The api this service fetches ACL'd series + graph from (via the Java SDK, forwarding the caller's JWT).
datahub.api.url=http://localhost:8081

# The browser posts to /analysis directly from the console origin, so allow it via CORS
# (comma-separated; override per environment). Mirrors the api's console origin.
cors.allowed-origins=http://localhost:8080

# Bucketed analysis payloads can be a few MB; keep the JSON body limit generous.
spring.mvc.async.request-timeout=120000
server.tomcat.max-swallow-size=32MB

# MCP server (same shape as datahub-api's): STATELESS streamable-HTTP at POST /mcp, served as a
# normal Spring MVC endpoint so SecurityConfig's JWT + ROLE_DATAHUB_ACCESS gate applies unchanged.
spring.ai.mcp.server.name=datahub-analysis-mcp-server
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.base-url=/mcp
spring.ai.mcp.server.version=1.0.0
