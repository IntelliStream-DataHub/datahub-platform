# Vault connection for production — provisioned by ops (an AppRole with read on the
# "datahub-platform" secret). VaultConfigurationLoader pulls the JWT issuer-uri from there.
vault.address=https://vault.example.com
vault.role-id=changeme
vault.secret-id=changeme
# Client certificate for a Vault listener that requires mutual TLS (PKCS12, or JKS by the .jks
# extension), and optionally the CA that signed Vault's server certificate. Leave unset for a
# Vault that does not require a client certificate. Also settable as VAULT_KEYSTORE,
# VAULT_KEYSTORE_PASSWORD, VAULT_TRUSTSTORE and VAULT_TRUSTSTORE_PASSWORD.
#vault.keystore=/etc/datahub/vault-client.p12
#vault.keystore-password=changeme
#vault.truststore=/etc/datahub/vault-ca.p12
#vault.truststore-password=changeme
