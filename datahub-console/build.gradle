plugins {
	id 'ai.intellistream.datahub.java-common-conventions'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

group = 'ai.intellistream.datahub'
version = '0.0.1-SNAPSHOT'

// Generates META-INF/build-info.properties, which Spring Boot turns into a BuildProperties bean.
// The About dialog reports the version and build time from it (see AboutInfo). The Boot plugin
// wires the task into `classes`, so `bootRun` and `bootJar` both get a current file; AboutInfo
// treats it as optional so a run without it still starts.
springBoot {
	buildInfo()
}


configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation project(':datahub-commons')

	//implementation "org.springframework.boot:spring-boot-starter-security"
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'com.jayway.jsonpath:json-path:3.0.0'

	//implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'

	// OpenFeign client
	implementation group: 'io.github.openfeign', name: 'feign-core', version: feignVersion
	implementation group: 'io.github.openfeign', name: 'feign-jackson', version: feignVersion
	implementation "io.github.openfeign:feign-java11:${feignVersion}"
	implementation "tools.jackson.dataformat:jackson-dataformat-xml:${jacksonVersion}"
	implementation "tools.jackson.core:jackson-databind:${jacksonVersion}"

	// Vault client
	implementation 'io.github.jopenlibs:vault-java-driver:6.2.3'

	// Model layer. Spring AI's Anthropic module wraps the same official anthropic-java SDK this
	// module used directly (and pins the same version), so this replaces that dependency rather
	// than adding a second path to the same API. Model modules, not Boot starters: a starter
	// auto-configures one ChatModel from static properties at startup, and an agent's model is
	// chosen per tenant at request time.
	implementation 'org.springframework.ai:spring-ai-anthropic'
	implementation 'org.springframework.ai:spring-ai-openai'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.5.RELEASE'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Prometheus scrape endpoint (/actuator/prometheus on the management port).
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	// Keep the default `test` task runnable in a bare checkout: the @Tag("integration") tests
	// drive a live datahub-api and need Vault credentials, so they run only under the dedicated
	// `integrationTest` task below.
	useJUnitPlatform { excludeTags 'integration' }
}

// Integration tests that require a running datahub-api and Vault access. They exercise the console
// against real endpoints rather than a stub, so they need a `test` profile config supplying
// `vault.*` — copy application-test.properties.example to application-test.properties (gitignored)
// and fill it in.
//
//   ./gradlew :datahub-console:integrationTest
//
tasks.register('integrationTest', Test) {
	description = 'Runs @Tag("integration") tests (require a running datahub-api and Vault).'
	group = 'verification'
	useJUnitPlatform { includeTags 'integration' }
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	// Activate the `test` profile so application-test.properties layers on top of the base
	// config. Without it Spring cannot resolve vault.address and the context fails to start.
	systemProperty 'spring.profiles.active', 'test'
}

// JS/CSS asset pipeline (JVM-based, no Node) — see assets.gradle and ASSETS.md.
apply from: "$projectDir/assets.gradle"