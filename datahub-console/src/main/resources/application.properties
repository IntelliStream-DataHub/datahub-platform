spring.mvc.static-path-pattern=/static/**

spring.main.lazy-initialization=true
spring.messages.encoding=UTF-8
server.servlet.session.timeout=120m
server.forward-headers-strategy=framework
# Prometheus scrape endpoint on its own port, so the load balancer never sees it and no login
# is needed. Open the port to the Prometheus host only.
management.server.port=9080
management.endpoints.web.exposure.include=prometheus
management.health.defaults.enabled=false
# For the tomcat_connections and tomcat_threads metrics.
server.tomcat.mbeanregistry.enabled=true

spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=datahub-console:session
spring.session.timeout=120m
spring.jackson.datetime-feature.write-dates-as-timestamps=false
spring.jackson.datetimefeature.=false
spring.jackson.time-zone=UTC

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Keeps Boot's resolver ahead of ThymeleafDevConfig's jar fallback; unset, null sorts last and the fallback wins.
spring.thymeleaf.template-resolver-order=1
