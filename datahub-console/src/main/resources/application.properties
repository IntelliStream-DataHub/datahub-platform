spring.mvc.static-path-pattern=/static/**

spring.main.lazy-initialization=true
spring.messages.encoding=UTF-8
server.servlet.session.timeout=120m
server.forward-headers-strategy=framework
# Prometheus scrape endpoint, on a port of its own so the load balancer never reaches it.
#
# OFF by default. The scrape is unauthenticated, so whatever can reach the port reads request
# rates, error rates, the endpoint inventory and JVM internals. Turn it on only once the port is
# reachable from the Prometheus host alone. Prefer mutual TLS over trusting the firewall:
# `management.server.ssl.*` takes its own keystore, truststore and `client-auth: need`, so only a
# Prometheus holding a certificate you issued can scrape. Unset, the port is plain HTTP.
# Read the security guidance first:
# https://intellistream.ai/data-platform-documentation/administration/monitoring#securing-the-endpoint
management.server.port=9080
# management.server.address=10.0.0.5   # narrow from the wildcard to an internal interface
# Add `prometheus` to serve /actuator/prometheus.
management.endpoints.web.exposure.include=
management.health.defaults.enabled=false
# For the tomcat_connections and tomcat_threads metrics.
server.tomcat.mbeanregistry.enabled=true

spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=datahub-console:session
spring.session.timeout=120m
spring.jackson.datetime-feature.write-dates-as-timestamps=false
spring.jackson.datetimefeature.=false
spring.jackson.time-zone=UTC

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Keeps Boot's resolver ahead of ThymeleafDevConfig's jar fallback; unset, null sorts last and the fallback wins.
spring.thymeleaf.template-resolver-order=1
