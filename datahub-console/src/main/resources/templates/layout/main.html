<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="htmlmeta">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <link rel="stylesheet" th:href="@{/static/css/all.css}" />
    <link rel="stylesheet" th:href="@{/static/css/tutorial.css}" />
    <link rel="icon" th:href="@{/static/img/favicon.ico}" type="image/x-icon">

    <!-- Apply the saved colour theme before first paint to avoid a flash. Dark is the
         default (no attribute); the toggle lives in the user menu below. -->
    <script>(function(){try{var t=localStorage.getItem('dh-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}}());</script>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- datahub-api base URL, for browser JS that calls the api host directly (e.g. the
         live-datapoint WebSocket and the value-type recommendation) rather than via the proxy. -->
    <meta name="datahub-api-url" th:content="${@environment.getProperty('datahub.url') ?: 'http://localhost:8081'}"/>
    <!-- datahub-analysis base URL: the Analyze tab posts the relationship analysis to this service
         directly (Bearer token from /token), which then gathers its data from the api. -->
    <meta name="datahub-analysis-url" th:content="${@environment.getProperty('datahub.analysis.url') ?: 'http://localhost:8082'}"/>
</th:block>

<body th:fragment="htmlbody (content, pageSelected)" th:classappend="${pageSelected == null ? 'page-home' : ''}">

<header>
    <a th:href="@{/}">
        <th:block th:replace="~{fragments/logo :: mark}"></th:block>
    </a>

    <nav>
        <a th:href="@{/datasets/index}" th:classappend="${pageSelected} == 'datasets' ? 'selected' : ''">
            <span th:text="#{data.governance}"></span>
        </a>
        <a th:href="@{/resources/index}" th:classappend="${pageSelected} == 'resources' ? 'selected' : ''">
            <span th:text="#{resources}"></span>
        </a>
        <a th:href="@{/files/list}" th:classappend="${pageSelected} == 'files' ? 'selected' : ''">
            <span th:text="#{main.files}"></span>
        </a>
        <a th:href="@{/events/index}" th:classappend="${pageSelected} == 'events' ? 'selected' : ''">
            <span th:text="#{events}"></span>
        </a>
        <a th:href="@{/timeseries/index}" th:classappend="${pageSelected} == 'timeseries' ? 'selected' : ''">
            <span th:text="#{timeseries}"></span>
        </a>
        <a th:href="@{/cdc}" th:classappend="${pageSelected} == 'streams' ? 'selected' : ''">
            <span th:text="#{streams}"></span>
        </a>
    </nav>

    <!-- The right-hand header cluster. Ask AI is a sibling of the user menu, not part of it:
         while the button sat inside .user-menu, hovering it opened the dropdown, which is why
         the dropdown was moved to click. .user-menu now wraps the name/avatar and the dropdown
         and nothing else, so :hover on it means what it says. -->
    <div class="right-content">
        <button type="button" class="ask-ai-btn" data-type="open-chat" aria-expanded="false"
                th:if="${@chatAccess.available()}">
            <span class="ask-ai-label" th:text="#{chat.ask.ai}">Ask AI</span>
            <span class="ask-ai-icon">
                <i class="fa-solid fa-comment"></i>
                <svg class="ask-ai-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 L14 10 L23 12 L14 14 L12 23 L10 14 L1 12 L10 10 Z"/></svg>
            </span>
        </button>
        <div class="user-menu">
            <div class="right-content" th:if="${#authorization.expression('isAuthenticated()')}" data-type="user-menu">
                <a th:href="@{/#}">
                    <div><span th:text="${@userSession.getName()}"></span></div>
                    <div><span class="small-text" th:text="${@userSession.getOrganizationName()}"></span></div>
                </a>
                <a th:href="@{/#}">
                    <span class="circle" th:text="${@userSession.getShortName()}"></span>
                </a>
            </div>
            <ul class="user-sub-menu">
                <li class="guided-tutorial-entry" data-type="guided-tutorial">
                    <span th:text="#{guided.tutorial}"></span>
                    <i class="fa-regular fa-circle-question"></i>
                </li>
                <li data-type="copy-token">
                    <span th:text="#{copy.token}"></span>
                    <i class="fa-regular fa-copy"></i>
                </li>
                <li data-type="toggle-theme">
                    <span class="theme-when-dark" th:text="#{theme.light}"></span>
                    <span class="theme-when-light" th:text="#{theme.dark}"></span>
                    <i class="fa-regular fa-sun theme-when-dark"></i>
                    <i class="fa-regular fa-moon theme-when-light"></i>
                </li>
                <li data-type="about">
                    <span th:text="#{about.menu}"></span>
                    <i class="fa-regular fa-circle-info"></i>
                </li>
                <li>
                    <a th:href="@{/datahub-logout}" th:text="#{logout}"></a>
                </li>

            </ul>

        </div>
    </div>
</header>

<div class="flash info" th:if="${flashMessage}" th:text="${flashMessage}"></div>
<div class="flash error" th:if="${flashError}" th:text="${flashError}"></div>

<main class="layout-body" th:replace="${content}"></main>

<div class="right-form"></div>

<div class="chat-panel" th:if="${@chatAccess.available()}"></div>

<!-- About DataHub. Opened from the user menu, and the console's AGPL section 13 source offer:
     the console is served over a network, so users interacting with it remotely must be offered
     its Corresponding Source. The "Source code" link below is that offer; do not remove it
     without replacing it with an equivalent one.

     A native <dialog> opened with showModal(): the browser's top layer puts it above the
     right-form, the chat panel and the tutorial overlays without another z-index to maintain,
     and gives Escape-to-close and focus trapping for free. Server-rendered rather than built in
     JS so every string comes from the message bundle. -->
<dialog id="about-dialog" class="about-dialog" aria-labelledby="aboutTitle">
    <div class="about-head">
        <button type="button" class="about-close" data-type="about-close" th:attr="aria-label=#{close}">
            <i class="fa fa-fw fa-close"></i>
        </button>
        <div class="about-logo" role="img" aria-label="IntelliStream"></div>
        <h3 id="aboutTitle" th:text="#{about.title}">About DataHub</h3>
        <p class="about-tagline" th:text="#{about.tagline}"></p>
        <div class="about-badges">
            <span class="about-badge" th:text="'v' + ${@aboutInfo.version}">v0.0.1</span>
            <span class="about-badge" th:if="${@aboutInfo.buildTime != null}"
                  th:text="${@aboutInfo.buildTime}"></span>
        </div>
    </div>

    <div class="about-body">
        <section>
            <h4 th:text="#{about.license.title}">License</h4>
            <p th:text="#{about.license.body}"></p>
            <p th:text="#{about.license.network}"></p>
            <p th:text="#{about.license.apache}"></p>
            <div class="about-links">
                <a href="https://github.com/IntelliStream-DataHub/datahub-platform"
                   rel="noopener" target="_blank">
                    <i class="fa fa-fw fa-link"></i><span th:text="#{about.link.source}">Source code</span>
                </a>
                <a href="https://www.gnu.org/licenses/agpl-3.0.html" rel="noopener" target="_blank">
                    <i class="fa fa-fw fa-file-lines"></i><span th:text="#{about.link.license}">License text</span>
                </a>
                <a href="https://github.com/IntelliStream-DataHub/datahub-platform/blob/main/NOTICE"
                   rel="noopener" target="_blank">
                    <i class="fa fa-fw fa-clipboard-check"></i><span th:text="#{about.link.notice}">Third-party notices</span>
                </a>
            </div>
        </section>

        <section>
            <h4 th:text="#{about.docs.title}">Documentation</h4>
            <div class="about-links">
                <a href="https://github.com/IntelliStream-DataHub/datahub-docs"
                   rel="noopener" target="_blank">
                    <i class="fa fa-fw fa-graduation-cap"></i><span th:text="#{about.link.docs}">Operator documentation</span>
                </a>
                <a href="https://github.com/IntelliStream-DataHub/datahub-sdk-docs"
                   rel="noopener" target="_blank">
                    <i class="fa fa-fw fa-cube"></i><span th:text="#{about.link.sdk}">SDK documentation</span>
                </a>
                <a th:href="${@aboutInfo.apiUrl} + '/swagger-ui.html'" rel="noopener" target="_blank">
                    <i class="fa fa-fw fa-diagram-project"></i><span th:text="#{about.link.api}">API reference</span>
                </a>
                <a href="https://github.com/IntelliStream-DataHub/datahub-platform/issues"
                   rel="noopener" target="_blank">
                    <i class="fa fa-fw fa-comment"></i><span th:text="#{about.link.issues}">Report an issue</span>
                </a>
            </div>
        </section>

        <section>
            <h4 th:text="#{about.deployment.title}">This deployment</h4>
            <p class="about-caption" th:text="#{about.deployment.caption}"></p>
            <dl class="about-facts">
                <div th:if="${@userSession.getName()}">
                    <dt th:text="#{about.fact.user}">Signed in as</dt>
                    <dd th:text="${@userSession.getName()}"></dd>
                </div>
                <div th:if="${@userSession.getOrganizationName()}">
                    <dt th:text="#{about.fact.organization}">Organization</dt>
                    <dd th:text="${@userSession.getOrganizationName()}"></dd>
                </div>
                <div>
                    <dt th:text="#{about.fact.api}">API endpoint</dt>
                    <dd th:text="${@aboutInfo.apiUrl}"></dd>
                </div>
                <div>
                    <dt th:text="#{about.fact.analysis}">Analysis service</dt>
                    <dd th:text="${@aboutInfo.analysisUrl}"></dd>
                </div>
            </dl>
        </section>
    </div>

    <footer class="about-foot">
        <span class="about-copyright" th:text="#{about.copyright}">Copyright (C) 2023-2026 IntelliStream AS</span>
        <button type="button" class="dh-btn primary" data-type="about-close">
            <span th:text="#{close}">Close</span>
        </button>
    </footer>
</dialog>

<!-- Tutorial UI shell (passive) -->
<div id="tutorial-start-modal" class="tutorial-modal hidden" aria-hidden="true">
    <div class="tutorial-modal-backdrop" data-tutorial-dismiss="start"></div>
    <div class="tutorial-modal-content" role="dialog" aria-modal="true" aria-labelledby="tutorialStartTitle">
        <h3 id="tutorialStartTitle" th:text="#{tutorial.start.title}"></h3>
        <p th:text="#{tutorial.start.description}"></p>

        <div class="tutorial-start-actions">
            <button type="button" class="dh-btn primary" data-tutorial-action="start" th:text="#{tutorial.start.start}"></button>
            <button type="button" class="dh-btn" data-tutorial-action="dismiss" th:text="#{tutorial.start.dismiss}"></button>
        </div>

        <p class="tutorial-chapters-label" th:text="#{tutorial.chapters.or}"></p>
        <div class="tutorial-chapter-grid">
            <button type="button" class="tutorial-chapter dh-btn" data-chapter="datasets" th:text="#{tutorial.chapters.datasets}"></button>
            <button type="button" class="tutorial-chapter dh-btn" data-chapter="resources" th:text="#{tutorial.chapters.resources}"></button>
            <button type="button" class="tutorial-chapter dh-btn" data-chapter="timeseries" th:text="#{tutorial.chapters.timeseries}"></button>
            <button type="button" class="tutorial-chapter dh-btn" data-chapter="correlation" th:text="#{tutorial.chapters.correlation}"></button>
            <button type="button" class="tutorial-chapter dh-btn" data-chapter="events" th:text="#{events}"></button>
            <button type="button" class="tutorial-chapter dh-btn" data-chapter="buildout" th:text="#{tutorial.chapters.buildout}"></button>
        </div>
    </div>
</div>

<div id="tutorial-industry-modal" class="tutorial-modal hidden" aria-hidden="true">
    <div class="tutorial-modal-backdrop" data-tutorial-dismiss="industry"></div>
    <div class="tutorial-modal-content" role="dialog" aria-modal="true" aria-labelledby="tutorialIndustryTitle">
        <h3 id="tutorialIndustryTitle" th:text="#{tutorial.industry.title}"></h3>
        <p th:text="#{tutorial.industry.description}"></p>

        <div class="tutorial-industry-grid">
            <button type="button" class="tutorial-industry dh-btn" data-industry="oil_gas" th:text="#{tutorial.industry.oil_gas}"></button>
            <button type="button" class="tutorial-industry dh-btn" data-industry="tech" th:text="#{tutorial.industry.tech}"></button>
            <button type="button" class="tutorial-industry dh-btn" data-industry="manufacturing" th:text="#{tutorial.industry.manufacturing}"></button>
            <button type="button" class="tutorial-industry dh-btn" data-industry="energy" th:text="#{tutorial.industry.energy}"></button>
        </div>

        <div class="tutorial-modal-actions">
            <button type="button" class="dh-btn" data-tutorial-action="back" th:text="#{tutorial.industry.back}"></button>
            <button type="button" class="dh-btn" data-tutorial-action="close-industry" th:text="#{tutorial.industry.close}"></button>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/assets :: js('app')}"></th:block>
<th:block th:if="${@chatAccess.available()}"
          th:replace="~{fragments/assets :: js('chat')}"></th:block>

<script th:inline="javascript" defer>
    document.addEventListener("DOMContentLoaded", () => {
        $L('you.have.been.signed.out', [[#{you.have.been.signed.out}]]);
        $L('ok', [[#{ok}]]);
    });

    (function(){
        const copyTokenEl = document.querySelector('[data-type="copy-token"]');
        if (!copyTokenEl) return;

        copyTokenEl.addEventListener('click', e => {
            fetch('/token').then(response => {
                if (response.status === 500) {
                    response.text().then(text => console.warn(text));
                } else if (response.status === 401) {
                    renderSignedOutDialog();
                } else {
                    response.text().then(token => {
                        navigator.clipboard.writeText(token);
                        const iconTag = copyTokenEl.querySelector('i');
                        const oldClassName = iconTag.className;
                        iconTag.className = "fa-regular fa-check";
                        setTimeout(() => {
                            iconTag.className = oldClassName;
                        }, 10000);
                    });
                }
            });
        });
    }());

    (function(){
        const toggle = document.querySelector('[data-type="toggle-theme"]');
        if (!toggle) return;

        toggle.addEventListener('click', () => {
            const root = document.documentElement;
            const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('dh-theme', next); } catch (e) { /* private mode: theme just won't persist */ }
        });
    }());

    // About dialog. showModal() puts it in the browser's top layer, so it floats above the
    // right-form, the chat panel and the tutorial overlays; Escape and focus trapping come with
    // the element. The dropdown it was opened from is closed first, so it is not left hanging
    // behind the modal.
    (function(){
        const dialog = document.getElementById('about-dialog');
        const opener = document.querySelector('[data-type="about"]');
        if (!dialog || !opener) return;

        opener.addEventListener('click', () => {
            const menu = opener.closest('.user-menu');
            if (menu) {
                menu.classList.remove('open');
                const trigger = menu.querySelector('[data-type="user-menu"]');
                if (trigger) trigger.setAttribute('aria-expanded', 'false');
            }
            dialog.showModal();
        });

        const close = () => dialog.close();
        dialog.querySelectorAll('[data-type="about-close"]').forEach(el => el.addEventListener('click', close));
        // A click that lands on the dialog element itself is a backdrop click: head, body and
        // foot fill it edge to edge, so nothing else can be the target.
        dialog.addEventListener('click', e => {
            if (e.target === dialog) close();
        });
    }());
</script>


<!-- Tutorial engine: shared across all pages, loaded only when the global
     tutorial.enabled toggle is on (tutorialActive, from LocaleModelAdvice).
     Bundled via the asset pipeline (see ASSETS.md); the i18n bundle itself is
     loaded for every page by application.js above. -->
<th:block th:if="${tutorialActive}">
    <th:block th:replace="~{fragments/assets :: js('tutorial')}"></th:block>
</th:block>

</body>
</html>
