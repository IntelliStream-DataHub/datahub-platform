<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Access Denied</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <th:block th:replace="~{error/_fragments :: styles}"></th:block>
</head>
<body>
<div class="wrap">
    <h1>403 – Access Denied</h1>
    <p>You don’t have permission to access this page.</p>
    <p th:if="${path}">Path: <code th:text="${path}"></code></p>
    <p th:if="${message}">Details: <span th:text="${message}"></span></p>
    <p><a class="button" th:href="@{/datahub-logout}">Clear Login Details</a></p>
</div>
</body>
</html>
