<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title th:text="#{settings.organization}"></title>
	<th:block th:replace="~{layout/main :: htmlmeta}" />
	<link rel="stylesheet" th:href="@{/static/css/settings.css}" />
</head>

<body th:replace="~{layout/main :: htmlbody(~{::main}, null)}">
<main class="layout-body">
	<nav th:replace="~{settings/nav :: navbar('organization')}"></nav>

	<div class="settings-page pad20">
		<header class="settings-header">
			<h2 th:text="#{settings.organization.title}"></h2>
			<!-- Read-only on purpose: these are what an operator has granted this organization, not
			     something it sets for itself. Showing them here is what makes the distinction
			     visible - everything on the AI page is yours to change, nothing on this one is. -->
			<p class="settings-intro" th:text="#{settings.organization.intro}"></p>
		</header>

		<dl class="settings-facts">
			<dt th:text="#{settings.organization.name}"></dt>
			<dd th:text="${@userSession.getOrganizationName()}"></dd>
		</dl>

		<h3 th:text="#{settings.organization.features}"></h3>
		<ul class="settings-features" data-type="feature-list">
			<li data-type="features-loading" th:text="#{loading}"></li>
		</ul>
	</div>

	<th:block th:replace="~{settings/i18n :: i18nMessages}"></th:block>
	<th:block th:replace="~{fragments/assets :: js('settings')}"></th:block>
</main>
</body>
</html>
