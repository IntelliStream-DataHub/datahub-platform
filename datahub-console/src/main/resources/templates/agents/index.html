<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title th:text="#{agents}"></title>
	<meta th:replace="~{layout/main :: htmlmeta}" />
	<link rel="stylesheet" th:href="@{/static/css/flows.css}" />
</head>
<body th:replace="~{layout/main :: htmlbody(~{::main}, 'agents')}">
<main class="layout-body">
	<nav th:replace="~{agents/nav :: navbar('list')}"></nav>

	<div th:if="${featureDisabled}" class="pad20">
		<p th:text="#{agents.not.enabled}">Agents need flows and a model configured for your organization.</p>
	</div>

	<!--/* Filled by flows/flows-list.js from datahub-flow: GET /flows?kind=agent, a page at a time.
	       The same list as Flows, with the links going to this section. */-->
	<div th:if="${!featureDisabled}" class="flows-page pad20" data-type="flows-list-page" data-kind="agent" data-section="agents">
		<div class="flows-header">
			<div>
				<h2 th:text="#{agents}"></h2>
				<p class="flows-intro" th:text="#{agents.list.intro}"></p>
			</div>
			<div class="flows-header-actions">
				<a class="dh-btn primary" data-type="flows-create" th:href="@{/agents(new='')}" th:text="#{agents.create}"></a>
			</div>
		</div>

		<table class="listing slim pointer w100" data-type="flows-table">
			<thead>
				<tr>
					<th th:text="#{flows.column.name}"></th>
					<th th:text="#{flows.column.dataset}"></th>
					<th th:text="#{flows.column.version}"></th>
					<th th:text="#{flows.column.deployment}"></th>
					<th th:text="#{flows.column.updated}"></th>
					<th></th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
		<p class="flows-empty" data-type="flows-empty" hidden th:text="#{agents.list.empty}"></p>
		<div class="flows-actions">
			<button type="button" class="dh-btn secondary" data-type="flows-load-more" hidden
					th:text="#{flows.load.more}"></button>
		</div>
	</div>

	<th:block th:if="${!featureDisabled}">
		<th:block th:replace="~{fragments/assets :: js('agents')}"></th:block>
	</th:block>
</main>
</body>
</html>
