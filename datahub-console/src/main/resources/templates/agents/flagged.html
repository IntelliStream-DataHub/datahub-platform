<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<title th:text="#{agents.nav.flagged}"></title>
	<meta th:replace="~{layout/main :: htmlmeta}" />
	<link rel="stylesheet" th:href="@{/static/css/flows.css}" />
</head>
<body th:replace="~{layout/main :: htmlbody(~{::main}, 'agents')}">
<main class="layout-body">
	<nav th:replace="~{agents/nav :: navbar('flagged')}"></nav>

	<div th:if="${featureDisabled}" class="pad20">
		<p th:text="#{agents.not.enabled}">Agents need flows and a model configured for your organization.</p>
	</div>

	<!--/* What agents flagged for a person to look at: the agent/flagged lifecycles in datahub-api whose
	       latest event is open, POST {api}/events/latest, filled by agents/agents-flagged.js.
	       Dismissing writes the dismissed event as the person dismissing. */-->
	<div th:if="${!featureDisabled}" class="flows-page pad20" data-type="agents-flagged-page">
		<div class="flows-header">
			<div>
				<h2 th:text="#{agents.nav.flagged}"></h2>
				<p class="flows-intro" th:text="#{agents.flagged.intro}"></p>
			</div>
			<div class="flows-header-actions">
				<button type="button" class="dh-btn secondary" data-type="flagged-dismiss-all" hidden
						th:text="#{agents.flagged.dismiss.all}"></button>
			</div>
		</div>
		<div th:replace="~{agents/flagged :: table}"></div>
	</div>

	<!--/* The list itself, shared with the tab on an agent's page. */-->
	<th:block th:fragment="table">
		<table class="listing slim w100" data-type="flagged-table">
			<thead>
				<tr>
					<th th:text="#{agents.column.agent}"></th>
					<th th:text="#{agents.column.when}"></th>
					<th th:text="#{agents.column.summary}"></th>
					<th></th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
		<p class="flows-empty" data-type="flagged-empty" hidden th:text="#{agents.flagged.empty}"></p>
		<div class="flows-actions">
			<button type="button" class="dh-btn secondary" data-type="flagged-more" hidden
					th:text="#{flows.load.more}"></button>
		</div>
	</th:block>

	<th:block th:if="${!featureDisabled}">
		<th:block th:replace="~{fragments/assets :: js('agents')}"></th:block>
	</th:block>
</main>
</body>
</html>
