tutorial.progress.intro=Getting started
tutorial.intro.welcome.title=Welcome to DataHub
tutorial.intro.welcome.content=<span class="tut-lead">Your assets, their measurements and the links between them usually live <span class="tut-accent">scattered</span> across spreadsheets and systems.</span> DataHub pulls them into <span class="tut-accent">one living map</span> your team can search, trace and monitor - so a question like "what does this sensor affect?" takes seconds, <span class="tut-highlight">not a meeting</span>. Let's build a small one together - about 5 minutes, and you can stop and resume any time.
tutorial.problem.title=Does this sound familiar?
tutorial.correlation.intro.title=Signals that move together
tutorial.correlation.intro.content=<span class="tut-lead">One measurement rarely tells the whole story.</span> When one part of your system works harder, its related signals <span class="tut-accent">rise and fall with it</span>. Apart, in separate dashboards, you would never notice. Let's put three on <span class="tut-highlight">one chart</span> and watch.
tutorial.correlation.seed.title=Bringing them together
tutorial.correlation.seed.content=Behind the scenes we're adding <span class="tut-accent">two more of the asset's sensors</span> - readings it already produces alongside the one you built. Hit <b>Next</b> whenever you're ready and we'll chart them.
tutorial.correlation.solo.title=Just your measurement
tutorial.correlation.solo.content=Here's the <span class="tut-accent">{0}</span> you built, charted on its own. It rises and falls - but on its own, nothing jumps out. So far, so ordinary.
tutorial.correlation.chart.title=They move as one
tutorial.correlation.chart.content=<span class="tut-lead">Now watch.</span> We overlay two more sensors from <span class="tut-accent">{0}</span> - and they rise and fall in <span class="tut-highlight">lockstep</span> with your reading. You didn't set that up; it's the asset's own physics, surfacing in data you could only read together because it's connected.
tutorial.future.teaser.title=And it gets easier
tutorial.future.teaser.content=<span class="tut-lead">You spotted that in a few clicks.</span> Connected data is what makes patterns like this findable in the first place - and <span class="tut-accent">richer analysis tools are on the way</span> to surface them across your whole network, so more of the insight comes to you. This is just the start.
tutorial.datasets.intro.title=Start with a dataset
tutorial.datasets.intro.content=<span class="tut-lead">Everything you build lives inside a <span class="tut-accent">dataset</span> - one project or domain.</span> It keeps related assets and their measurements together, and it's the level access is granted on, so each team sees exactly what's theirs and nothing else. That's why it's the <span class="tut-highlight">first thing you create</span>.
tutorial.datasets.create.title=Create a dataset
tutorial.datasets.create.content=Click + to create one.
tutorial.datasets.name.title=Name
tutorial.datasets.name.content=Enter a dataset name. Example: {0}
tutorial.datasets.externalId.title=External ID
tutorial.datasets.externalId.content=An external id is a stable, unique reference - like a serial number - so systems can link to this even if its name changes. Example: {0}
tutorial.datasets.description.title=Description
tutorial.datasets.description.content=Add a description for the dataset.
tutorial.datasets.save.title=Save dataset
tutorial.datasets.save.content=Click Save to create the dataset.
tutorial.datasets.select.title=Select your dataset
tutorial.datasets.select.content=Click the dataset you just created in the list.
tutorial.datasets.node.title=Your dataset node
tutorial.datasets.node.content=This is your new dataset, shown as a node - the root your resources will hang off. Let's add some.
tutorial.datasets.scenario.oil_gas.name=Valve pressure sensors
tutorial.datasets.scenario.oil_gas.externalId=valve_pressure_sensors
tutorial.datasets.scenario.oil_gas.description=Pressure measurements from valve actuators (subsea + topside). Used for condition monitoring and maintenance planning.
tutorial.datasets.scenario.oil_gas.intro=Example: We will model valve pressure sensors so you can track reliability and maintenance.
tutorial.datasets.scenario.tech.name=Smart building telemetry
tutorial.datasets.scenario.tech.externalId=smart_building_telemetry
tutorial.datasets.scenario.tech.description=IoT telemetry from buildings (temperature, CO2, occupancy). Used for energy optimization and alerts.
tutorial.datasets.scenario.tech.intro=Example: We will model smart-building telemetry for monitoring and optimization.
tutorial.datasets.scenario.manufacturing.name=Production line quality signals
tutorial.datasets.scenario.manufacturing.externalId=production_line_quality_signals
tutorial.datasets.scenario.manufacturing.description=Signals from a production line. Used for traceability and defect reduction.
tutorial.datasets.scenario.manufacturing.intro=Example: We will model production-line quality signals for traceability.
tutorial.datasets.scenario.energy.name=Grid asset monitoring
tutorial.datasets.scenario.energy.externalId=grid_asset_monitoring
tutorial.datasets.scenario.energy.description=Monitoring data for energy assets (transformers, breakers). Used for reliability and predictive maintenance.
tutorial.datasets.scenario.energy.intro=Example: We will model grid asset monitoring for reliability tracking.

# Resources chapter - per-industry node names
tutorial.datasets.scenario.oil_gas.resourceName=Valve A
tutorial.datasets.scenario.oil_gas.resourceExternalId=valve_a
tutorial.datasets.scenario.oil_gas.resource2Name=Valve B
tutorial.datasets.scenario.oil_gas.tsName=Pressure
tutorial.datasets.scenario.oil_gas.corr2Name=Flow rate
tutorial.datasets.scenario.oil_gas.corr3Name=Temperature
tutorial.datasets.scenario.oil_gas.problemContent=<span class="tut-lead">It's 2am and a <span class="tut-accent">valve</span> is spiking.</span> Is it the pump upstream? The line temperature? Each reading lives in its own system, so nobody sees they're connected - and the crew loses hours chasing a fault the data already knows. <span class="tut-highlight">DataHub puts them on one map.</span>
tutorial.datasets.scenario.tech.resourceName=Floor 1 sensor
tutorial.datasets.scenario.tech.resourceExternalId=floor_1_sensor
tutorial.datasets.scenario.tech.resource2Name=Floor 2 sensor
tutorial.datasets.scenario.tech.tsName=Temperature
tutorial.datasets.scenario.tech.corr2Name=CPU load
tutorial.datasets.scenario.tech.corr3Name=Fan speed
tutorial.datasets.scenario.tech.problemContent=<span class="tut-lead">Floor 3 overheats every afternoon.</span> Is it <span class="tut-accent">CPU load</span>? The inlet temperature? A failing fan? The telemetry is scattered across dashboards, so the pattern hides in plain sight while tickets pile up. <span class="tut-highlight">DataHub puts them on one map.</span>
tutorial.datasets.scenario.manufacturing.resourceName=Station 1
tutorial.datasets.scenario.manufacturing.resourceExternalId=station_1
tutorial.datasets.scenario.manufacturing.resource2Name=Station 2
tutorial.datasets.scenario.manufacturing.tsName=Throughput
tutorial.datasets.scenario.manufacturing.corr2Name=Motor vibration
tutorial.datasets.scenario.manufacturing.corr3Name=Motor temperature
tutorial.datasets.scenario.manufacturing.problemContent=<span class="tut-lead">Defects on Line 2 are creeping up.</span> Is it <span class="tut-accent">throughput</span>? A vibrating motor? Quality data and machine data live apart, so scrap piles up before anyone connects the dots. <span class="tut-highlight">DataHub puts them on one map.</span>
tutorial.datasets.scenario.energy.resourceName=Transformer T1
tutorial.datasets.scenario.energy.resourceExternalId=transformer_t1
tutorial.datasets.scenario.energy.resource2Name=Transformer T2
tutorial.datasets.scenario.energy.tsName=Voltage
tutorial.datasets.scenario.energy.corr2Name=Load
tutorial.datasets.scenario.energy.corr3Name=Winding temperature
tutorial.datasets.scenario.energy.problemContent=<span class="tut-lead">A transformer runs hot at every peak.</span> Is it the <span class="tut-accent">load</span>? The oil temperature? The winding? Each signal sits in its own historian, so you react to failures instead of predicting them. <span class="tut-highlight">DataHub puts them on one map.</span>

# Resources chapter - step text
tutorial.resources.nav.title=Open Resources
tutorial.resources.nav.content=Click the <b>Resources</b> tab at the top to open the network view.
tutorial.resources.intro.title=Build your network
tutorial.resources.intro.content=<span class="tut-lead">A <span class="tut-accent">resource</span> is a real thing - a valve, a sensor, a machine.</span> On their own they're just a list. Connect them the way they actually relate and you get a <span class="tut-accent">network</span> you can trace: what feeds what, and what a fault here touches over there. <span class="tut-highlight">That's the question a spreadsheet can't answer.</span> Let's add a couple.
tutorial.resources.create.title=Create a resource
tutorial.resources.create.content=Click here to create your first resource - a thing in your system.
tutorial.resources.name.title=Name the resource
tutorial.resources.name.content=Give it a name, for example <i>{0}</i>.
tutorial.resources.externalId.title=Add an external id
tutorial.resources.externalId.content=A stable, unique handle for this resource - systems use it to link reliably. Try <i>{0}</i>.
tutorial.resources.label.title=Add a label
tutorial.resources.label.content=Every resource needs a <span class="tut-accent">label</span> - the kind of thing it is (ASSET, PUMP, SENSOR...). Labels colour the node and let you filter the graph by type. Click + to choose one.
tutorial.resources.metadata.title=Metadata (optional)
tutorial.resources.metadata.content=Metadata is free key/value context - location, owner, calibration date. Use it to attach anything you'll later want to search, filter or group by, with no schema change. Optional - skip it for now and continue.
tutorial.resources.labelPick.title=Choose a label
tutorial.resources.labelPick.content=Pick the type that best fits your resource - e.g. <span class="tut-accent">PUMP</span>, <span class="tut-accent">SENSOR</span>, or a generic <span class="tut-accent">ASSET</span>. Don't see a fit? Type a new one. Then click Confirm.
tutorial.resources.save.title=Save the resource
tutorial.resources.save.content=Save it - it will show up in your list of resources.
tutorial.resources.select.title=Open it in the graph
tutorial.resources.select.content=Click the resource you just created to open it in the network graph.
tutorial.resources.node.title=Your resource
tutorial.resources.node.content=Here is your resource as a node - the heart of the network view.
tutorial.resources.connect.title=Add a connected resource
tutorial.resources.connect.content=Tap your node and choose the <span class="tut-accent">+</span> to add a resource connected to it - call this one <span class="tut-accent">{0}</span>. The line that appears between them is their relationship.
tutorial.resources.connectForm.title=Fill in the connection
tutorial.resources.connectForm.content=Now fill it in: choose a <span class="tut-accent">relationship</span> (how the two relate - e.g. <i>contains</i>, <i>monitors</i>, <i>powers</i>), add a label, and name it <span class="tut-accent">{0}</span>. Then Save.
tutorial.resources.networkBeat.title=Your resource network
tutorial.resources.networkBeat.content=Your two resources are now linked into a small network - the line is the relationship to <i>{0}</i>. Next, let's add a measurement.
tutorial.resources.recap.title=You built a network!
tutorial.resources.recap.content=A dataset, resources linked by relationships, a timeseries measuring one, events logged against them, and a whole network built out - a real DataHub graph. Keep it to build on, or remove everything the tutorial created.
tutorial.end.keep=Keep it
tutorial.end.delete=Remove tutorial data
tutorial.timeseries.nav.title=Open Timeseries
tutorial.timeseries.nav.content=Click the <b>Timeseries</b> tab at the top.
tutorial.timeseries.intro.title=Why measure over time?
tutorial.timeseries.intro.content=<span class="tut-lead">One reading tells you now. A <span class="tut-accent">timeseries</span> tells you the story.</span> It's every reading a resource produces, kept in order over time - so you can spot trends, catch drift before it becomes a failure, and compare one asset against another. Let's put one on the resource you built.
tutorial.timeseries.create.title=Create a timeseries
tutorial.timeseries.create.content=Click the create button to open the menu.
tutorial.timeseries.createMenu.title=Choose timeseries
tutorial.timeseries.createMenu.content=Pick <i>Create Time Series</i> from the menu.
tutorial.timeseries.name.title=Name the measurement
tutorial.timeseries.name.content=Give it a name, for example <i>{0}</i>. The external id fills in automatically.
tutorial.timeseries.unit.title=Pick a unit
tutorial.timeseries.unit.content=A unit is what the measurement is in (bar, &deg;C) - needed to read and compare series. Click + to pick one.
tutorial.timeseries.unitPick.title=Choose a unit
tutorial.timeseries.unitPick.content=Pick a unit from the list (e.g. bar, &deg;C, kWh), then click Confirm.
tutorial.timeseries.valueType.title=Value type
tutorial.timeseries.valueType.content=This sets how readings are stored. A measurement needs decimals, so we've set it to <i>Float</i> for you - continue.
tutorial.timeseries.relation.title=Connect it to a resource
tutorial.timeseries.relation.content=A measurement belongs to the thing it measures. Click + to <span class="tut-accent">link this series to a resource</span> - that's what puts it in the network, right next to the asset it comes from.
tutorial.timeseries.relationPick.title=Pick a resource
tutorial.timeseries.relationPick.content=Choose the resource it measures (e.g. <i>{0}</i>) and how they relate - the <span class="tut-accent">relationship type</span> names the link, like <i>measures</i> or <i>monitors</i>. Then Confirm.
tutorial.timeseries.save.title=Save the timeseries
tutorial.timeseries.save.content=Save it - it joins the network as a measurement on your resource.
tutorial.timeseries.viewNav.title=See your network
tutorial.timeseries.viewNav.content=Click the <b>Resources</b> tab - the network graph lives there.
tutorial.timeseries.network.title=Your full network
tutorial.timeseries.network.content=Here it is - your resources connected by a relationship, with the timeseries measuring one of them. A small DataHub graph, built from scratch.
tutorial.timeseries.dataset.title=Put it in your dataset
tutorial.timeseries.dataset.content=Remember the <b>{0}</b> dataset you made? We're filing this measurement under it - that's how a dataset groups the data for one project.
tutorial.timeseries.seed.title=Add some readings
tutorial.timeseries.seed.content=A timeseries is empty until data flows in. We've just pushed a couple of days of sample readings so you can see it on a chart.
tutorial.timeseries.chart.title=See your data
tutorial.timeseries.chart.content=Click your timeseries to chart it.
tutorial.timeseries.chartExplain.title=Your data, charted
tutorial.timeseries.chartExplain.content=This is your measurement over time. Real data streams in from your sensors or systems through the API - copy your access token from the user menu (top right) to start sending your own.
tutorial.events.intro.title=Things happen to your assets
tutorial.events.intro.content=<span class="tut-lead">Measurements are the steady signal. <span class="tut-accent">Events</span> are the moments that matter.</span> An alarm fires, a threshold is crossed, a maintenance job runs - each a timestamped record of what happened, and to which asset. Line them up against the signal and you can see <span class="tut-highlight">why</span> the numbers moved.
tutorial.events.seed.title=A couple of events
tutorial.events.seed.content=The log fills straight from what you just did on <b>{0}</b> - it joined the network, its measurement came online, and a reading tripped a threshold. Let's go look.
tutorial.events.nav.title=Open the event log
tutorial.events.nav.content=Click the <b>Events</b> tab to see everything that has happened across your assets.
tutorial.events.list.title=The event log
tutorial.events.list.content=Every alarm and job lands here - timestamped, and filterable by type, time, or asset on the left. The events from your tour show up as they finish processing.
tutorial.events.details.title=It ties back to your network
tutorial.events.details.content=Click any event to open it - the details list the resources it concerns, so an alarm on <b>{0}</b> points you straight to the affected asset. Data, relationships, and events together: a live picture of your network.
tutorial.buildout.intro.title=Now grow your network
tutorial.buildout.intro.content=You've created your first resource and time series by hand. The real value is a connected network - so let's add a few more pieces and see how they fit together.
tutorial.buildout.building.title=Building your network
tutorial.buildout.building.content=We're adding a small asset network for you - a process line with a pump, valve, tank, sensor and motor, all connected. One moment...
tutorial.buildout.explain.title=This is your knowledge graph
tutorial.buildout.explain.content=Every asset and how they relate, in one connected picture. Teams can search it, trace dependencies, and monitor what matters - that's what DataHub is for.
tutorial.buildout.trace.title=Trace a connection
tutorial.buildout.trace.content=Dim the rest and a path stands out. This is how you follow dependencies - which assets a sensor feeds, or what a change would ripple into.
tutorial.buildout.yourturn.title=Your turn
tutorial.buildout.yourturn.content=Try adding a few of your own - say a "Compressor" or a "Cooler" - and connect them to the line. Aim for 5-10 nodes. You can keep going after the tour, or finish here.
