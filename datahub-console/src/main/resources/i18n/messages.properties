naming.help.dialog.title=Naming assets and resources
naming.help.examples.asset=Equipment and functional locations, tag first:
naming.help.examples.dataset=Collections grouped by source or ownership:
naming.help.examples.function=Computations, named after what they produce:
naming.help.examples.timeseries=One series per measurement, named after the instrument loop:
naming.help.examples.title=Examples
naming.help.fields.externalid=External id is the stable identifier, the part that follows the namespace in an IRI. Imports, integrations and the SDK match on it, so it must never change and never be reused for something else. Type your own and it is stored exactly as you type it, so a plant tag stays the plant tag; leave it and the form suggests a lowercase underscored id derived from the name.
naming.help.fields.label=Label is the class the resource belongs to (rdf:type), for example Pump or Separator. Write classes in the singular with each word capitalised.
naming.help.fields.name=Name is the readable label (rdfs:label in RDF). Write it for a person scanning a list. It can be changed at any time.
naming.help.fields.title=What each field carries
naming.help.icon.title=How to name this. Click for the ontology and tag conventions.
naming.help.intro=DataHub stores everything as a graph, so an asset, a time series, a function and a data set are all resources in an ontology, the same idea RDF describes. Three fields carry that model, and the tagging standard your facility already uses fills the same three roles.
naming.help.rdf.caption=The same asset written as RDF:
naming.help.rules.abbrev=Use the abbreviations your operators already read on the P&ID. Do not invent new ones.
naming.help.rules.nounits=Leave units, value types and time ranges out of the name. They have their own fields.
naming.help.rules.singular=Name the thing itself, not the document or the system it came from. One resource is one physical or logical thing.
naming.help.rules.stable=Keep the external id stable. Never encode anything that changes, such as owner, vendor, location or project phase.
naming.help.rules.tag=Lead with the plant tag when the facility has one, then a short description: "21-PT-1234 Separator inlet pressure".
naming.help.rules.title=Rules of thumb
naming.help.rules.unique=Make the external id unique across the whole facility, not just inside one system.
naming.help.standards.cfihos=CFIHOS (IOGP JIP36), which fixes the equipment classes and attribute names handed over from project to operations.
naming.help.standards.intro=Naming in oil and gas is already standardised. Follow whichever standard your facility uses and mirror it here.
naming.help.standards.isa=ISA-5.1 instrument tags: the first letter is the measured variable and the letters after it are the function. PT is a pressure transmitter, TI a temperature indicator, FIC a flow indicating controller.
naming.help.standards.iso15926=ISO 15926, the life cycle data model for process plants. Part 8 maps it onto RDF and OWL, which turns the reference data library into an ontology you can query.
naming.help.standards.iso81346=IEC/ISO 81346 reference designations, which separate the aspects of an item with prefix signs: = for function, - for product, + for location.
naming.help.standards.norsok=NORSOK Z-DP-002, the coding system used on the Norwegian shelf, which breaks an installation down into systems, subsystems and item tags.
naming.help.standards.title=Standards this follows
