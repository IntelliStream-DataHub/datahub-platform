value.type.help=Storage type for the values. Pick a unit and we suggest the most storage-efficient type for it. Click for details.
value.type.description=The value type sets how each datapoint is stored in DataHub — its size, precision and compression. It is fixed when the series is created and cannot be changed later, so pick the most compact type that still represents your data:
value.type.help.bigint=Whole numbers with no decimals — counters and tallies. Most compact storage for integer values.
value.type.help.float=64-bit floating point. Fast to aggregate with tiny rounding; good for analog measurements.
value.type.help.float32=32-bit floating point — half the storage of Float. For analog values where ~7 significant digits is enough.
value.type.help.decimal32=Exact decimals (4 places), very compact. Best for small-range readings like temperature or percent.
value.type.help.numeric=Exact decimals (6 places) with a large range. Use when values must be exact (billing, finance).
value.type.help.text=Arbitrary text — states, labels, modes or other non-numeric readings.
value.type.help.mixed=Numbers and text in one series — many sensors publish text statuses (e.g. FAULT) alongside float measurements.
