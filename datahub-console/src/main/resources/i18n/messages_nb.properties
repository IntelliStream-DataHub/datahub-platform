tutorial.datasets.intro.title=Start med et datasett
tutorial.datasets.intro.content=<span class="tut-lead">Alt du bygger, ligger inne i et <span class="tut-accent">datasett</span> - ett prosjekt eller domene.</span> Det holder relaterte ressurser og målingene deres samlet, og det er nivået tilgang gis på, så hvert team ser akkurat det som er deres og ingenting annet. Derfor er det det <span class="tut-highlight">første du oppretter</span>.
