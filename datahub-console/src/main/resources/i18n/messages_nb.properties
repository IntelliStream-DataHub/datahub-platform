tutorial.datasets.scenario.manufacturing.corr2Name=Motorvibrasjon
tutorial.datasets.scenario.manufacturing.corr3Name=Motortemperatur
tutorial.datasets.scenario.manufacturing.problemContent=<span class="tut-lead">Feilraten på linje 2 kryper oppover.</span> Er det <span class="tut-accent">gjennomstrømningen</span>? En vibrerende motor? Kvalitetsdata og maskindata ligger hver for seg, så vraket hoper seg opp før noen kobler det sammen. <span class="tut-highlight">DataHub samler dem på ett kart.</span>
