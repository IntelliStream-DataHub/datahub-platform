value.type=Verditype
value.type.help=Lagringstype for verdiene. Velg en enhet, så foreslår vi den mest plasseffektive typen. Klikk for detaljer.
value.type.description=Verditypen bestemmer hvordan hvert datapunkt lagres i DataHub — størrelse, presisjon og komprimering. Den fastsettes når serien opprettes og kan ikke endres senere, så velg den mest kompakte typen som fortsatt representerer dataene dine:
value.type.help.bigint=Heltall uten desimaler — tellere og opptellinger. Mest kompakt lagring for heltallsverdier.
value.type.help.float=64-bits flyttall. Rask å aggregere med liten avrunding; bra for analoge målinger.
value.type.help.float32=32-bits flyttall — halve lagringsplassen av Float. For analoge verdier der ~7 signifikante siffer holder.
value.type.help.decimal32=Eksakte desimaler (4 plasser), svært kompakt. Best for verdier med lite område som temperatur eller prosent.
value.type.help.numeric=Eksakte desimaler (6 plasser) med stort område. Bruk når verdiene må være eksakte (fakturering, økonomi).
value.type.help.text=Vilkårlig tekst — tilstander, etiketter, moduser eller andre ikke-numeriske avlesninger.
value.type.help.mixed=Tall og tekst i samme serie — mange sensorer publiserer tekststatuser (f.eks. FAULT) sammen med flyttallsmålinger.
