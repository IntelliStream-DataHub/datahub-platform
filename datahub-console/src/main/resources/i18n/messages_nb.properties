tutorial.datasets.scenario.oil_gas.problemContent=<span class="tut-lead">Klokka er 02 og en <span class="tut-accent">ventil</span> får trykktopper.</span> Er det pumpen oppstrøms? Linjetemperaturen? Hver måling ligger i sitt eget system, så ingen ser at de henger sammen - og mannskapet bruker timer på å jage en feil dataene allerede kjenner. <span class="tut-highlight">DataHub samler dem på ett kart.</span>
tutorial.datasets.scenario.tech.resourceName=Sensor etasje 1
tutorial.datasets.scenario.tech.resourceExternalId=floor_1_sensor
tutorial.datasets.scenario.tech.resource2Name=Sensor etasje 2
tutorial.datasets.scenario.tech.tsName=Temperatur
tutorial.datasets.scenario.tech.corr2Name=CPU-last
