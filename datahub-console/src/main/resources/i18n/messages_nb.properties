naming.help.fields.externalid=Ekstern id er den stabile identifikatoren, delen som følger etter navneområdet i en IRI. Import, integrasjoner og SDK-en kobler mot den, så den må aldri endres og aldri gjenbrukes på noe annet. Skriver du inn din egen, lagres den nøyaktig slik du skrev den, slik at en anleggstagg forblir anleggstaggen; lar du den stå, foreslår skjemaet en id med små bokstaver og understrek utledet fra navnet.
naming.help.fields.label=Merkelapp er klassen ressursen tilhører (rdf:type), for eksempel Pump eller Separator. Skriv klasser i entall med stor forbokstav i hvert ord.
naming.help.fields.name=Navn er den lesbare etiketten (rdfs:label i RDF). Skriv det for et menneske som leser gjennom en liste. Det kan endres når som helst.
naming.help.fields.title=Hva hvert felt bærer
naming.help.icon.title=Slik navngir du. Klikk for konvensjonene for ontologi og tagging.
naming.help.intro=DataHub lagrer alt som en graf, så en ressurs, en tidsserie, en funksjon og et datasett er alle ressurser i en ontologi, på samme måte som RDF beskriver den. Tre felt bærer denne modellen, og taggstandarden anlegget ditt allerede bruker fyller de samme tre rollene.
naming.help.rdf.caption=Den samme ressursen skrevet som RDF:
naming.help.rules.abbrev=Bruk forkortelsene operatørene allerede leser på P&ID-en. Ikke finn opp nye.
naming.help.rules.nounits=Hold enheter, verdityper og tidsrom utenfor navnet. De har sine egne felt.
naming.help.rules.singular=Navngi tingen selv, ikke dokumentet eller systemet den kom fra. En ressurs er en fysisk eller logisk ting.
naming.help.rules.stable=Hold ekstern id stabil. Kod aldri inn noe som endrer seg, som eier, leverandør, lokasjon eller prosjektfase.
naming.help.rules.tag=Start med anleggstaggen når anlegget har en, og legg til en kort beskrivelse: "21-PT-1234 Separator innløpstrykk".
naming.help.rules.title=Tommelfingerregler
naming.help.rules.unique=Gjør ekstern id unik for hele anlegget, ikke bare innenfor ett system.
naming.help.standards.cfihos=CFIHOS (IOGP JIP36), som fastsetter utstyrsklassene og attributtnavnene som overleveres fra prosjekt til drift.
naming.help.standards.intro=Navngiving i olje og gass er allerede standardisert. Følg den standarden anlegget ditt bruker, og speil den her.
naming.help.standards.isa=ISA-5.1 instrumenttagger: første bokstav er den målte variabelen, og bokstavene etter er funksjonen. PT er en trykktransmitter, TI en temperaturindikator, FIC en strømningsindikerende regulator.
naming.help.standards.iso15926=ISO 15926, livsløpsdatamodellen for prosessanlegg. Del 8 uttrykker den i RDF og OWL, noe som gjør referansedatabiblioteket til en ontologi du kan spørre mot.
naming.help.standards.iso81346=IEC/ISO 81346 referansebetegnelser, som skiller aspektene ved et objekt med prefikstegn: = for funksjon, - for produkt, + for lokasjon.
naming.help.standards.norsok=NORSOK Z-DP-002, kodesystemet som brukes på norsk sokkel, som bryter en installasjon ned i systemer, delsystemer og objekttagger.
naming.help.standards.title=Standarder dette følger
