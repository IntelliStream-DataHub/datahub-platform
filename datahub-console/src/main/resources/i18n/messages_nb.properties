tutorial.datasets.scenario.tech.problemContent=<span class="tut-lead">Etasje 3 blir for varm hver ettermiddag.</span> Er det <span class="tut-accent">CPU-last</span>? Inntakstemperaturen? En sviktende vifte? Telemetrien er spredt over dashbord, så mønsteret gjemmer seg i åpent lys mens sakene hoper seg opp. <span class="tut-highlight">DataHub samler dem på ett kart.</span>
