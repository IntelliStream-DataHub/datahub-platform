insights.analysis.timescale=dominerende felles periode
insights.analysis.cointegrated=varig sammenheng
insights.analysis.stable=konsistent
insights.analysis.unstable=inkonsistent
insights.analysis.synchronous=synkron
insights.analysis.focusLeads=fokus leder med
insights.analysis.focusLags=fokus etter med
insights.analysis.resolutionNote=Ledetid/etterslep måles i hele bøtter, og bøttebredden utledes fra det valgte tidsrommet. En forskyvning kortere enn en bøtte kan ikke skilles fra null, og vises derfor som «synkron». Velg et kortere tidsrom for finere oppløsning.
insights.analysis.synchronousNote=Ingen ledetid/etterslep ved denne oppløsningen — enhver forskyvning er mindre enn en bøtte. Velg et kortere tidsrom for å oppløse finere forsinkelser.
insights.analysis.notCointegrated=ingen varig sammenheng
insights.analysis.cointegratedNote=Disse to holder seg knyttet sammen over tid i stedet for å drive fra hverandre — et forhold du kan stole på.
insights.analysis.notCointegratedNote=Enhver likhet her er kortvarig — over lengre tid driver disse to fra hverandre, så ikke regn med at forholdet holder.
insights.analysis.stableNote=Dette forholdet holder gjennom hele tidsrommet, ikke bare i en periode — så det er mer til å stole på.
insights.analysis.unstableNote=Vær forsiktig med å tolke dette. Forholdet vises i deler av tidsrommet, men ikke i andre — det kan være en tilfeldighet eller en engangshendelse heller enn en pålitelig sammenheng.
insights.analysis.timescaleNote=Perioden der disse signalene beveger seg mest sammen.
insights.analysis.coherencePlotNote=Viser perioden for felles svingninger i disse tidsseriene.
