tutorial.datasets.scenario.energy.problemContent=<span class="tut-lead">En transformator går varm ved hver topp.</span> Er det <span class="tut-accent">lasten</span>? Oljetemperaturen? Viklingen? Hvert signal sitter i sitt eget historikksystem, så du reagerer på feil i stedet for å forutse dem. <span class="tut-highlight">DataHub samler dem på ett kart.</span>

# Resources chapter - step text
tutorial.resources.nav.title=Åpne Ressurser
tutorial.resources.nav.content=Klikk på <b>Ressurser</b>-fanen øverst for å åpne nettverksvisningen.
tutorial.resources.intro.title=Bygg nettverket ditt
tutorial.resources.intro.content=<span class="tut-lead">En <span class="tut-accent">ressurs</span> er en virkelig ting - en ventil, en sensor, en maskin.</span> Alene er de bare en liste. Koble dem sammen slik de faktisk henger sammen, og du får et <span class="tut-accent">nettverk</span> du kan spore: hva som påvirker hva, og hva en feil her berører der borte. <span class="tut-highlight">Det er spørsmålet et regneark ikke kan svare på.</span> La oss legge til et par.
tutorial.resources.create.title=Opprett en ressurs
tutorial.resources.create.content=Klikk her for å opprette din første ressurs - en ting i systemet ditt.
tutorial.resources.name.title=Gi ressursen et navn
tutorial.resources.name.content=Gi den et navn, for eksempel <i>{0}</i>.
tutorial.resources.externalId.title=Legg til en ekstern id
tutorial.resources.externalId.content=Et stabilt, unikt håndtak for denne ressursen - systemer bruker det til å koble pålitelig. Prøv <i>{0}</i>.
tutorial.resources.label.title=Legg til en etikett
tutorial.resources.label.content=Hver ressurs trenger en <span class="tut-accent">etikett</span> - hva slags ting den er (ASSET, PUMP, SENSOR...). Etiketter farger noden og lar deg filtrere grafen etter type. Klikk + for å velge en.
tutorial.resources.metadata.title=Metadata (valgfritt)
tutorial.resources.metadata.content=Metadata er fri nøkkel/verdi-kontekst - plassering, eier, kalibreringsdato. Bruk det til å feste alt du senere vil søke, filtrere eller gruppere på, uten skjemaendring. Valgfritt - hopp over det for nå og fortsett.
tutorial.resources.labelPick.title=Velg en etikett
tutorial.resources.labelPick.content=Velg typen som passer ressursen din best - f.eks. <span class="tut-accent">PUMP</span>, <span class="tut-accent">SENSOR</span> eller en generell <span class="tut-accent">ASSET</span>. Finner du ingen som passer? Skriv en ny. Klikk så Bekreft.
tutorial.resources.save.title=Lagre ressursen
tutorial.resources.save.content=Lagre den - den dukker opp i listen over ressurser.
tutorial.resources.select.title=Åpne den i grafen
tutorial.resources.select.content=Klikk på ressursen du nettopp opprettet for å åpne den i nettverksgrafen.
tutorial.resources.node.title=Ressursen din
tutorial.resources.node.content=Her er ressursen din som en node - kjernen i nettverksvisningen.
tutorial.resources.connect.title=Legg til en koblet ressurs
tutorial.resources.connect.content=Trykk på noden din og velg <span class="tut-accent">+</span> for å legge til en ressurs koblet til den - kall denne <span class="tut-accent">{0}</span>. Linjen som dukker opp mellom dem er relasjonen deres.
tutorial.resources.connectForm.title=Fyll ut koblingen
tutorial.resources.connectForm.content=Fyll den ut: velg en <span class="tut-accent">relasjon</span> (hvordan de henger sammen - f.eks. <i>inneholder</i>, <i>overvåker</i>, <i>driver</i>), legg til en etikett, og gi den navnet <span class="tut-accent">{0}</span>. Lagre så.
tutorial.resources.networkBeat.title=Ressursnettverket ditt
tutorial.resources.networkBeat.content=De to ressursene dine er nå koblet sammen til et lite nettverk - linjen er relasjonen til <i>{0}</i>. La oss legge til en måling.
tutorial.resources.recap.title=Du bygde et nettverk!
tutorial.resources.recap.content=Et datasett, ressurser koblet med relasjoner, en tidsserie som måler en av dem, hendelser logget mot dem, og et helt nettverk bygget ut - en ekte DataHub-graf. Behold det å bygge videre på, eller fjern alt opplæringen lagde.
tutorial.end.keep=Behold det
tutorial.end.delete=Fjern opplæringsdata
tutorial.timeseries.nav.title=Åpne Tidsserier
tutorial.timeseries.nav.content=Klikk på <b>Tidsserier</b>-fanen øverst.
tutorial.timeseries.intro.title=Hvorfor måle over tid?
tutorial.timeseries.intro.content=<span class="tut-lead">Én avlesning forteller deg nå. En <span class="tut-accent">tidsserie</span> forteller deg historien.</span> Det er hver avlesning en ressurs produserer, holdt i rekkefølge over tid - så du kan se trender, fange opp avvik før det blir en feil, og sammenligne én ressurs med en annen. La oss legge en på ressursen du bygde.
tutorial.timeseries.create.title=Opprett en tidsserie
tutorial.timeseries.create.content=Klikk på opprett-knappen for å åpne menyen.
tutorial.timeseries.createMenu.title=Velg tidsserie
tutorial.timeseries.createMenu.content=Velg <i>Opprett tidsserie</i> fra menyen.
tutorial.timeseries.name.title=Gi målingen et navn
tutorial.timeseries.name.content=Gi den et navn, for eksempel <i>{0}</i>. Ekstern id fylles ut automatisk.
tutorial.timeseries.unit.title=Velg en enhet
tutorial.timeseries.unit.content=En enhet er hva målingen er i (bar, &deg;C) - nødvendig for å lese og sammenligne serier. Klikk + for å velge en.
tutorial.timeseries.unitPick.title=Velg en enhet
tutorial.timeseries.unitPick.content=Velg en enhet fra listen (f.eks. bar, &deg;C, kWh), og klikk Bekreft.
tutorial.timeseries.valueType.title=Verditype
tutorial.timeseries.valueType.content=Dette bestemmer hvordan målinger lagres. En måling trenger desimaler, så vi har satt den til <i>Float</i> for deg - fortsett.
tutorial.timeseries.relation.title=Koble den til en ressurs
tutorial.timeseries.relation.content=En måling hører til tingen den måler. Klikk + for å <span class="tut-accent">koble serien til en ressurs</span> - det er det som setter den inn i nettverket, rett ved siden av ressursen den kommer fra.
tutorial.timeseries.relationPick.title=Velg en ressurs
tutorial.timeseries.relationPick.content=Velg ressursen den måler (f.eks. <i>{0}</i>) og hvordan de henger sammen - <span class="tut-accent">relasjonstypen</span> navngir koblingen, som <i>måler</i> eller <i>overvåker</i>. Bekreft så.
tutorial.timeseries.save.title=Lagre tidsserien
tutorial.timeseries.save.content=Lagre den - den blir en måling på ressursen i nettverket ditt.
tutorial.timeseries.viewNav.title=Se nettverket ditt
tutorial.timeseries.viewNav.content=Klikk på <b>Ressurser</b>-fanen - nettverksgrafen ligger der.
tutorial.timeseries.network.title=Hele nettverket ditt
tutorial.timeseries.network.content=Her er det - ressursene dine koblet med en relasjon, med tidsserien som måler en av dem. En liten DataHub-graf, bygget fra bunnen av.
tutorial.timeseries.dataset.title=Legg den i datasettet ditt
tutorial.timeseries.dataset.content=Husker du <b>{0}</b>-datasettet du lagde? Vi legger denne målingen under det - slik grupperer et datasett dataene for ett prosjekt.
tutorial.timeseries.seed.title=Legg til noen målinger
tutorial.timeseries.seed.content=En tidsserie er tom til data kommer inn. Vi har akkurat lagt inn et par dager med eksempelmålinger så du kan se den i en graf.
tutorial.timeseries.chart.title=Se dataene dine
tutorial.timeseries.chart.content=Klikk på tidsserien din for å vise den i en graf.
tutorial.timeseries.chartExplain.title=Dataene dine, visualisert
tutorial.timeseries.chartExplain.content=Dette er målingen din over tid. Ekte data strømmer inn fra sensorer eller systemer via API-et - kopier tilgangstokenet ditt fra brukermenyen (øverst til høyre) for å begynne å sende dine egne.
tutorial.events.intro.title=Ting skjer med ressursene dine
tutorial.events.intro.content=<span class="tut-lead">Målinger er det jevne signalet. <span class="tut-accent">Hendelser</span> er øyeblikkene som betyr noe.</span> En alarm utløses, en grense overskrides, en vedlikeholdsjobb kjøres - hver en tidsstemplet registrering av hva som skjedde, og med hvilken ressurs. Still dem opp mot signalet, og du ser <span class="tut-highlight">hvorfor</span> tallene endret seg.
tutorial.events.seed.title=Et par hendelser
tutorial.events.seed.content=Loggen fylles rett fra det du nettopp gjorde på <b>{0}</b> - den ble koblet til nettverket, målingen kom i gang, og en avlesning utløste en terskel. La oss se på dem.
tutorial.events.nav.title=Åpne hendelsesloggen
tutorial.events.nav.content=Klikk på <b>Hendelser</b>-fanen for å se alt som har skjedd på tvers av ressursene dine.
tutorial.events.list.title=Hendelsesloggen
tutorial.events.list.content=Alle alarmer og jobber havner her - tidsstemplet, og filtrerbart etter type, tid eller ressurs til venstre. Hendelsene fra veiledningen din dukker opp når de er ferdig behandlet.
tutorial.events.details.title=Det knytter seg til nettverket ditt
tutorial.events.details.content=Klikk på en hendelse for å åpne den - detaljene viser ressursene den gjelder, så en alarm på <b>{0}</b> peker deg rett til ressursen. Data, relasjoner og hendelser sammen: et levende bilde av nettverket ditt.
tutorial.buildout.intro.title=Bygg ut nettverket ditt
tutorial.buildout.intro.content=Du har laget din første ressurs og tidsserie for hånd. Den virkelige verdien ligger i et tilkoblet nettverk - så la oss legge til noen flere deler og se hvordan de henger sammen.
tutorial.buildout.building.title=Bygger nettverket ditt
tutorial.buildout.building.content=Vi legger til et lite ressursnettverk for deg - en prosesslinje med pumpe, ventil, tank, sensor og motor, alle koblet sammen. Et øyeblikk...
tutorial.buildout.explain.title=Dette er kunnskapsgrafen din
tutorial.buildout.explain.content=Alle ressurser og hvordan de henger sammen, i ett tilkoblet bilde. Team kan søke i den, spore avhengigheter og overvåke det som betyr noe - det er det DataHub er til for.
tutorial.buildout.trace.title=Spor en kobling
tutorial.buildout.trace.content=Demp resten, så trer en sti fram. Slik følger du avhengigheter - hvilke ressurser en sensor mater, eller hva en endring vil forplante seg til.
tutorial.buildout.yourturn.title=Din tur
tutorial.buildout.yourturn.content=Prøv å legge til noen egne - for eksempel en "Kompressor" eller en "Kjøler" - og koble dem til linjen. Sikt på 5-10 noder. Du kan fortsette etter veiledningen, eller avslutte her.
