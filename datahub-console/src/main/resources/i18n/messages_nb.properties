tutorial.intro.welcome.title=Velkommen til DataHub
tutorial.intro.welcome.content=<span class="tut-lead">Ressursene dine, målingene deres og koblingene mellom dem ligger som regel <span class="tut-accent">spredt</span> i regneark og systemer.</span> DataHub samler dem i <span class="tut-accent">ett levende kart</span> teamet kan søke i, spore og overvåke - slik at et spørsmål som "hva påvirker denne sensoren?" tar sekunder, <span class="tut-highlight">ikke et møte</span>. La oss bygge et lite kart sammen - omtrent 5 minutter, og du kan stoppe og fortsette når som helst.
tutorial.problem.title=Kjenner du deg igjen?
tutorial.correlation.intro.title=Signaler som følger hverandre
tutorial.correlation.intro.content=<span class="tut-lead">Én måling forteller sjelden hele historien.</span> Når én del av systemet jobber hardere, <span class="tut-accent">stiger og faller de relaterte signalene med den</span>. Hver for seg, i separate dashbord, ville du aldri lagt merke til det. La oss sette tre i <span class="tut-highlight">én graf</span> og se.
tutorial.correlation.seed.title=Vi samler dem
tutorial.correlation.seed.content=Bak kulissene legger vi til <span class="tut-accent">to sensorer til fra ressursen</span> - avlesninger den allerede produserer ved siden av den du bygde. Trykk <b>Neste</b> når du er klar, så viser vi dem i grafen.
tutorial.correlation.solo.title=Bare målingen din
tutorial.correlation.solo.content=Her er <span class="tut-accent">{0}</span> du bygde, alene i grafen. Den stiger og faller - men alene er det ingenting som stikker seg ut. Helt vanlig, så langt.
tutorial.correlation.chart.title=De beveger seg i takt
tutorial.correlation.chart.content=<span class="tut-lead">Se nå.</span> Vi legger to sensorer til fra <span class="tut-accent">{0}</span> oppå - og de stiger og faller i <span class="tut-highlight">takt</span> med avlesningen din. Det satte du ikke opp; det er ressursens egen fysikk som kommer til syne i data du bare kunne lese samlet fordi den er koblet sammen.
tutorial.future.teaser.title=Og det blir enklere
tutorial.future.teaser.content=<span class="tut-lead">Det fant du på noen få klikk.</span> Sammenkoblede data er det som gjør slike mønstre mulige å finne i det hele tatt - og <span class="tut-accent">rikere analyseverktøy er på vei</span> for å løfte dem fram på tvers av hele nettverket ditt, så mer av innsikten kommer til deg. Dette er bare begynnelsen.
