// =============================================================================================
// Asset pipeline (JVM only — no Node).
//
// Declarative JS/CSS bundles whose contents come from *manifest* files using Sprockets-style
// require directives. Each declared bundle is compiled by a Gradle task: JS via Closure Compiler,
// CSS via Closure Stylesheets. Output lands in build/generated/assets/static/... which is added
// as a resource root, so bundles ship in the jar and are served under /static/.
//
// Developer guide: ASSETS.md
// =============================================================================================

configurations {
	closureCompiler      // build-only classpath for the JS compiler
	closureStylesheets   // build-only classpath for the CSS compiler
}

dependencies {
	closureCompiler 'com.google.javascript:closure-compiler:v20260607'
	// Resolved only when a CSS bundle is declared below. Verify the version/main-class on first use.
	closureStylesheets 'org.padler:closure-stylesheets:1.8.0'
}

def staticSrcDir = file('src/main/resources/static')
def generatedAssetsDir = layout.buildDirectory.dir('generated/assets')

// ---- Declared bundles -----------------------------------------------------------------------
// `manifest` and `output` are paths relative to the static dir. Add bundles here; no other
// changes are needed (a task is generated per bundle).
def assetBundles = [
		// Site-wide bundle loaded on every page by layout/main.html (global helpers + shared widgets).
		[name: 'app',       type: 'js', manifest: 'js/app.manifest.js',        output: 'js/app.bundle.min.js'],
		[name: 'rightForm', type: 'js', manifest: 'js/right-form.manifest.js', output: 'js/right-form.bundle.min.js'],
		[name: 'files',     type: 'js', manifest: 'js/files.manifest.js',      output: 'js/files.bundle.min.js'],
		[name: 'resources', type: 'js', manifest: 'js/resources.manifest.js',  output: 'js/resources.bundle.min.js'],
		[name: 'tutorial',  type: 'js', manifest: 'js/tutorial.manifest.js',   output: 'js/tutorial.bundle.min.js'],
		[name: 'dashboard', type: 'js', manifest: 'js/dashboard.manifest.js',  output: 'js/dashboard.bundle.min.js'],
		[name: 'insights',  type: 'js', manifest: 'js/insights.manifest.js',   output: 'js/insights.bundle.min.js'],
		[name: 'analyze',   type: 'js', manifest: 'js/analyze.manifest.js',    output: 'js/analyze.bundle.min.js'],
		[name: 'findings',  type: 'js', manifest: 'js/findings.manifest.js',  output: 'js/findings.bundle.min.js'],
		[name: 'chat',      type: 'js', manifest: 'js/chat.manifest.js',       output: 'js/chat.bundle.min.js'],
		[name: 'settings',  type: 'js', manifest: 'js/settings.manifest.js',   output: 'js/settings.bundle.min.js'],
		// CSS example (create the manifest first, then uncomment):
		// [name: 'app', type: 'css', manifest: 'css/app.manifest.css', output: 'css/app.bundle.min.css'],
]

// Parse Sprockets-style require directives from a manifest, preserving order and de-duping.
//   //= require path/to/file.js        (JS manifests)
//   /*= require path/to/file.css */    (CSS manifests)
// Paths resolve relative to the manifest's own directory.
def parseManifest = { File manifest ->
	if (!manifest.exists()) {
		throw new GradleException("Asset manifest not found: ${manifest}")
	}
	def dir = manifest.parentFile
	def sources = []
	manifest.eachLine { line ->
		def m = (line =~ /^\s*(?:\/\/|\/\*)=\s*require\s+(.+?)\s*(?:\*\/)?\s*$/)
		if (m.find()) {
			def f = new File(dir, m.group(1).trim())
			if (!f.exists()) {
				throw new GradleException("Manifest '${manifest.name}' requires missing file: ${f}")
			}
			if (!sources.contains(f)) {
				sources << f
			}
		}
	}
	if (sources.isEmpty()) {
		throw new GradleException("Manifest '${manifest}' declares no 'require' directives")
	}
	return sources
}

def assetTasks = assetBundles.collect { bundle ->
	def manifestFile = new File(staticSrcDir, bundle.manifest)
	def sources = parseManifest(manifestFile)
	def outFile = generatedAssetsDir.get().file("static/${bundle.output}").asFile
	def taskName = 'asset_' + bundle.output.replaceAll('[^A-Za-z0-9]', '_')

	tasks.register(taskName, JavaExec) {
		group = 'build'
		description = "Bundle ${bundle.type.toUpperCase()} asset '${bundle.output}' from ${bundle.manifest}"
		inputs.file(manifestFile)
		inputs.files(sources)
		outputs.file(outFile)
		doFirst { outFile.parentFile.mkdirs() }

		if (bundle.type == 'js') {
			classpath = configurations.closureCompiler
			mainClass = 'com.google.javascript.jscomp.CommandLineRunner'
			// SIMPLE only: these classes are referenced by global name from inline template
			// scripts, so ADVANCED (which renames) would break them.
			def a = ['--compilation_level', 'SIMPLE',
					 '--language_in', 'ECMASCRIPT_NEXT',
					 '--language_out', 'ECMASCRIPT_2021',
					 '--warning_level', 'QUIET',
					 '--js_output_file', outFile.absolutePath]
			sources.each { a += ['--js', it.absolutePath] }
			args = a
		} else if (bundle.type == 'css') {
			classpath = configurations.closureStylesheets
			mainClass = 'com.google.common.css.compiler.commandline.ClosureCommandLineCompiler'
			def a = ['--output-file', outFile.absolutePath]
			sources.each { a += [it.absolutePath] }
			args = a
		} else {
			throw new GradleException("Unknown asset bundle type '${bundle.type}' for ${bundle.output}")
		}
	}
}

// Single source of truth for the runtime: emit a registry derived from the SAME declaration and
// the SAME manifest parser used above, so AssetService never re-declares or re-parses anything.
// For each bundle it records the prod bundle URL and the ordered dev source URLs.
def registryFile = generatedAssetsDir.get().file('asset-bundles.properties').asFile
tasks.register('generateAssetRegistry') {
	group = 'build'
	description = 'Generate asset-bundles.properties (read by AssetService) from the declared bundles.'
	def declared = assetBundles
	inputs.property('bundles', declared.toString())
	declared.each { inputs.file(new File(staticSrcDir, it.manifest)) }
	outputs.file(registryFile)
	doLast {
		registryFile.parentFile.mkdirs()
		def sb = new StringBuilder('# Generated by assets.gradle - do not edit. Read by AssetService.\n')
		declared.each { b ->
			def urls = parseManifest(new File(staticSrcDir, b.manifest)).collect {
				'/static/' + staticSrcDir.toPath().relativize(it.toPath()).toString().replace('\\', '/')
			}
			sb << "${b.name}.bundle=/static/${b.output}\n"
			sb << "${b.name}.sources=${urls.join(',')}\n"
		}
		registryFile.text = sb.toString()
	}
}

tasks.register('buildAssets') {
	group = 'build'
	description = 'Build all declared JS/CSS asset bundles + the runtime registry.'
	dependsOn assetTasks, 'generateAssetRegistry'
}

// Ship generated bundles + registry in the jar (bundles served at /static/...) and build them
// before resources.
sourceSets.main.resources.srcDir(generatedAssetsDir)
tasks.named('processResources') { dependsOn 'buildAssets' }
