name: DCO

# CONTRIBUTING.md says every commit must carry a Developer Certificate of Origin
# sign-off and that maintainers check it. This automates that promise, so the
# answer arrives on the pull request instead of in a review round.
#
# Deliberately a plain shell check rather than a third-party action: it is a
# dozen lines of git, and a marketplace action here would mean trusting another
# repository with a token on every pull request for no benefit.

on:
  pull_request:
    branches: [master]

jobs:
  check-sign-off:
    name: Check commits are signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit GitHub synthesises has no sign-off of its own, and
          # the default shallow clone cannot see the branch point. Fetch enough
          # history to list exactly the commits this pull request adds.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              continue
            fi
            # A merge commit brings in commits that were signed off on their own
            # branch; requiring a sign-off on the merge itself adds nothing.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi
            echo "::error::Missing Signed-off-by on $(git show -s --format='%h %s' "$sha") by $author"
            missing=$((missing + 1))
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing commit(s) are missing a Developer Certificate of Origin sign-off."
            echo ""
            echo "Add one with:    git commit -s"
            echo "Fix the last:    git commit --amend -s --no-edit"
            echo "Fix a branch:    git rebase --signoff origin/master"
            echo "then force-push. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits carry a sign-off."
