name: Feature request
description: Suggest a capability or a change in behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: |
        What you are trying to do and where the platform gets in the way. Describe the
        situation rather than the solution: it usually leads somewhere better.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already have a shape in mind, describe it.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you are using now, and why they fall short.
