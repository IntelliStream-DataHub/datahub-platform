plugins {
	id 'ai.intellistream.datahub.java-common-conventions'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'idea'
}

group = 'ai.intellistream.datahub.cleanup'


configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// datahub-infra brings the JPA SubscriptionRepository + the multi-tenant routing datasource and
	// the Pulsar admin client the subscription sweep needs, plus the ClickHouse client the weekly
	// event-dimension rebuild reads from. datahub-commons brings TenantConfigService (the tenant list
	// from Vault) used by the file jobs and for per-tenant iteration. The Neo4j and Valkey clients
	// pulled in transitively connect lazily and stay unused — see the app's @ComponentScan.
	implementation project(':datahub-infra')
	implementation project(':datahub-commons')

	implementation 'org.springframework.boot:spring-boot-starter'
	// Tomcat, for the Prometheus scrape endpoint only (/actuator/prometheus); nothing else listens.
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Vault client — loads the tenant list + global secrets (Pulsar admin creds) at startup.
	implementation 'io.github.jopenlibs:vault-java-driver:6.2.3'

	// Jackson (JsonMapper) is autoconfigured by Spring Boot and required by TenantConfigService.
	implementation "tools.jackson.core:jackson-databind:${jacksonVersion}"

	implementation("org.apache.pulsar:pulsar-client-admin:${pulsarVersion}") {
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}
	implementation("org.apache.pulsar:pulsar-client-admin-api:${pulsarVersion}") {
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}
	implementation("org.apache.pulsar:pulsar-client:${pulsarVersion}") {
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}
	implementation("org.apache.pulsar:pulsar-client-api:${pulsarVersion}") {
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}

	// The flow records' retention sets the TTL of each tenant's flow_run_event table directly.
	implementation 'com.clickhouse:client-v2:0.10.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
	testImplementation 'org.testcontainers:clickhouse:1.21.4'
	// SharedPostgres: one migrated Postgres container, a database per test class (FlowRetentionTaskIT).
	testImplementation testFixtures(project(':datahub-infra'))
}

tasks.named('test') {
	// The @Tag("integration") tests need a container runtime and run under integrationTest.
	useJUnitPlatform { excludeTags 'integration' }
}

//   ./gradlew :datahub-cleanup:integrationTest
tasks.register('integrationTest', Test) {
	description = 'Runs @Tag("integration") tests (require Podman/Docker).'
	group = 'verification'
	useJUnitPlatform { includeTags 'integration' }
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')
}
