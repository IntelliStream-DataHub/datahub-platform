 */

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Required for the Flyway Gradle plugin to recognize Postgres (Flyway 10+).
        classpath 'org.flywaydb:flyway-database-postgresql:11.20.0'
    }
}

plugins {
    id 'ai.intellistream.datahub.java-library-conventions'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    // Migration scripts live in this module (src/main/resources/db/migration), so the local-dev
    // flywayMigrate/flywayInfo tasks live here too: ./gradlew :datahub-infra:flywayMigrate
    id "org.flywaydb.flyway" version "11.20.0"
    // SharedPostgres lives in src/testFixtures so integration tests in other modules can reuse the
    // one migrated container instead of standing up their own. See datahub-api's ITs.
    id 'java-test-fixtures'
}

flyway {
    url = 'jdbc:postgresql://localhost:5432/datahub'
    user = 'istream'
    password = 'changeme'
    cleanDisabled = false
    // Defaults to filesystem:src/main/resources/db/migration — this module's own scripts.
}


dependencies {
    implementation project(':datahub-commons')

    // Neo4j
    implementation 'org.neo4j.driver:neo4j-java-driver:6.1.0'
    implementation 'org.neo4j:neo4j-cypher-dsl:2025.2.7'

    // Vault client
    implementation 'io.github.jopenlibs:vault-java-driver:6.2.0'

    // Redis client
    //implementation group: 'redis.clients', name: 'jedis', version: '5.1.2'
    implementation group: 'io.lettuce', name: 'lettuce-core', version: '6.7.1.RELEASE'
    // Redis client pool Not in use, doesnt work correctly
    // implementation group: 'org.apache.commons', name: 'commons-pool2', version: '2.12.0'


    implementation("org.apache.pulsar:pulsar-client-admin:${pulsarVersion}"){
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
    }
    implementation("org.apache.pulsar:pulsar-client-admin-api:${pulsarVersion}"){
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
    }
    implementation("org.apache.pulsar:pulsar-client:${pulsarVersion}") {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
    }
    // BouncyCastle for Pulsar TLS. Declared explicitly because Pulsar only pulls it in via the
    // jar-in-jar 'bouncy-castle-bc:pkg' artifact, whose nested classes a flat classloader (IDE run
    // configs) cannot load. See https://pulsar.apache.org/docs/4.0.x/security-bouncy-castle/
    runtimeOnly 'org.bouncycastle:bcprov-jdk18on:1.84'
    runtimeOnly 'org.bouncycastle:bcpkix-jdk18on:1.84'

    implementation 'org.apache.tika:tika-core:3.3.0'
    // Apache Commons Hashing
    implementation 'commons-codec:commons-codec:1.21.0'

    // Open Feign
    implementation group: 'io.github.openfeign', name: 'feign-core', version: feignVersion
    implementation group: 'io.github.openfeign', name: 'feign-jackson', version: feignVersion
    implementation "io.github.openfeign:feign-java11:${feignVersion}"
    implementation "tools.jackson.dataformat:jackson-dataformat-xml:${jacksonVersion}"
    implementation "tools.jackson.core:jackson-databind:${jacksonVersion}"

    implementation 'net.openhft:zero-allocation-hashing:0.27ea0'

    implementation 'com.clickhouse:client-v2:0.9.8'
    implementation 'com.clickhouse:clickhouse-http-client:0.9.8'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6'

    implementation 'org.postgresql:postgresql'

    // Flyway lives here (not in datahub-api) so both datahub-api's on-demand tenant provisioning and
    // datahub-cleanup's scheduled self-heal sweep share one migration engine and one copy of the
    // scripts under src/main/resources/db/migration. See TenantMigrationService.
    implementation 'org.flywaydb:flyway-core:11.20.0'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql:11.20.0'

    implementation 'at.yawk.lz4:lz4-java:1.11.0'
    implementation 'com.github.luben:zstd-jni:1.5.7-7'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito for unit tests (versions managed by the Spring Boot BOM).
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'

    // Testcontainers: spins up a real ClickHouse to validate RowBinary encoding end-to-end, and a
    // real PostgreSQL to validate JPA repository behaviour (node_type filtering on the shared `node`
    // table). Integration tests are tagged "integration" and need a container runtime (Docker/Podman).
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:clickhouse:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'

    // Test fixtures (SharedPostgres). These are `implementation` on the main source set, so they
    // are not on the fixtures compile classpath by inheritance and have to be named again.
    testFixturesImplementation 'org.flywaydb:flyway-core:11.20.0'
    testFixturesImplementation 'org.testcontainers:postgresql:1.20.4'
    testFixturesRuntimeOnly 'org.flywaydb:flyway-database-postgresql:11.20.0'
    testFixturesRuntimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.testcontainers:neo4j:1.20.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 split the test slices into per-technology modules: @DataJpaTest lives in
    // spring-boot-data-jpa-test and @AutoConfigureTestDatabase in spring-boot-jdbc-test.
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-jdbc-test'
}


// Library module: no main class, so don't build an executable boot jar.
bootJar { enabled = false }
jar { enabled = true; archiveClassifier = '' }

// Keep `test` runnable without a container runtime; run container tests explicitly with
// `./gradlew :datahub-infra:integrationTest` (or `:performanceTest`) on a host that has Docker/Podman.
tasks.named('test') {
    useJUnitPlatform { excludeTags 'integration' }
}

// Testcontainers runtime wiring shared by the container test tasks: point at the rootless Podman socket
// when DOCKER_HOST isn't already set, and disable the Ryuk reaper (it does not work under rootless Podman;
// the test JVM stops containers via JUnit/shutdown hooks instead).
def configureContainerRuntime = { Test t ->
    if (!System.getenv('DOCKER_HOST')) {
        def uid = ['id', '-u'].execute().text.trim()
        def podmanSocket = "/run/user/${uid}/podman/podman.sock"
        if (file(podmanSocket).exists()) {
            t.environment 'DOCKER_HOST', "unix://${podmanSocket}"
        }
    }
    t.environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
}

tasks.register('integrationTest', Test) {
    description = 'Runs @Tag("integration") tests (require Docker/Podman).'
    group = 'verification'
    // Exclude the long @Tag("performance") load tests; run those via the performanceTest task.
    useJUnitPlatform { includeTags 'integration'; excludeTags 'performance' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    configureContainerRuntime(it)
}

tasks.register('performanceTest', Test) {
    description = 'Runs @Tag("performance") ClickHouse load tests (require Docker/Podman; long-running).'
    group = 'verification'
    useJUnitPlatform { includeTags 'performance' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    configureContainerRuntime(it)
}
