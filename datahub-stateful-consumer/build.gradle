plugins {
	id 'ai.intellistream.datahub.java-common-conventions'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'idea'
}

group = 'ai.intellistream.datahub.consumer.stateful'
version = '0.0.1-SNAPSHOT'


idea {
	module {
		downloadJavadoc = true
		downloadSources = true
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':datahub-infra')
	implementation project(':datahub-commons')

	// Neo4j
	implementation 'org.neo4j.driver:neo4j-java-driver:6.2.1'
	implementation 'org.neo4j:neo4j-cypher-dsl:2025.3.0'

	// Vault client
	implementation 'io.github.jopenlibs:vault-java-driver:6.2.3'

	// Open Feign
	implementation group: 'io.github.openfeign', name: 'feign-core', version: feignVersion
	implementation group: 'io.github.openfeign', name: 'feign-jackson', version: feignVersion
	implementation "io.github.openfeign:feign-java11:${feignVersion}"
	implementation "tools.jackson.dataformat:jackson-dataformat-xml:${jacksonVersion}"
	implementation "tools.jackson.core:jackson-databind:${jacksonVersion}"

	implementation("org.apache.pulsar:pulsar-client-admin:${pulsarVersion}"){
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}
	implementation("org.apache.pulsar:pulsar-client-admin-api:${pulsarVersion}"){
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}
	implementation("org.apache.pulsar:pulsar-client:${pulsarVersion}") {
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}
	implementation ("org.apache.pulsar:pulsar-client-api:${pulsarVersion}"){
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}

	implementation 'net.openhft:zero-allocation-hashing:0.27ea0'

	implementation 'at.yawk.lz4:lz4-java:1.11.2'
	implementation 'com.github.luben:zstd-jni:1.5.7-15'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
	testImplementation 'org.testcontainers:pulsar:1.21.4'
	testImplementation 'org.testcontainers:neo4j:1.21.4'
}

tasks.named('test') {
	// Keep the default `test` task runnable without a container runtime: the @Tag("integration")
	// Neo4j tests run only under the dedicated `integrationTest` task below.
	useJUnitPlatform { excludeTags 'integration' }
}

// Integration tests that require a container runtime (Podman or Docker) — they spin up a real Neo4j.
//   ./gradlew :datahub-stateful-consumer:integrationTest
tasks.register('integrationTest', Test) {
	description = 'Runs @Tag("integration") Neo4j tests (require Podman/Docker).'
	group = 'verification'
	useJUnitPlatform { includeTags 'integration' }
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')
	// Ryuk does not work under rootless Podman; the test JVM stops the container via a shutdown hook.
	environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
}
