# Use trace if you want to see parameter binding
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: OFF
    org.hibernate.orm.jdbc.bind: info
    org:
      hibernate:
        type: info
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

postgres:
  datasource:
    driverClassName: org.postgresql.Driver
    dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  address: https://vault.example.com
  role-id: changeme
  secret-id: changeme
  # Client certificate for a Vault listener that requires mutual TLS (PKCS12, or JKS by the .jks
  # extension), and optionally the CA that signed Vault's server certificate. Leave unset for a
  # Vault that does not require a client certificate. Also settable as VAULT_KEYSTORE,
  # VAULT_KEYSTORE_PASSWORD, VAULT_TRUSTSTORE and VAULT_TRUSTSTORE_PASSWORD.
  #keystore: /etc/datahub/vault-client.p12
  #keystore-password: changeme
  #truststore: /etc/datahub/vault-ca.p12
  #truststore-password: changeme
