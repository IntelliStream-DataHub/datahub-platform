# AVEVA PDMS/E3D model conversion - stateless, no database, no queue. OAuth2 resource server: it
# validates the user JWT the browser presents (see SecurityConfig) and forwards it to the api when
# fetching the model, so the api's per-dataset ACLs decide what may be converted. The issuer-uri is
# loaded from Vault at startup (VaultConfigurationLoader) from the shared "datahub-platform" secret,
# so the Vault connection is supplied per-profile. Run with SPRING_PROFILES_ACTIVE=dev|prod.
spring.application.name=datahub-rvm-converter
server.port=8083

# Prometheus scrape endpoint, on a port of its own so the load balancer never reaches it.
#
# OFF by default, like every other service here: the scrape is unauthenticated, so whatever can
# reach the port reads request rates, error rates and JVM internals. Turn it on only once the port
# is reachable from the Prometheus host alone, preferably behind mutual TLS (management.server.ssl.*
# from the Vault keystore) rather than a firewall rule alone.
management.server.port=9084
management.endpoints.web.exposure.include=
management.health.defaults.enabled=false
server.tomcat.mbeanregistry.enabled=true

# The api this service fetches the model from, via the Java SDK, forwarding the caller's JWT.
datahub.api.url=http://localhost:8081

# The browser calls /models/gltf directly from the console origin, so allow it via CORS.
cors.allowed-origins=http://localhost:8080

# The statically linked binary from tools/rvm-converter/build.sh, shipped alongside this service.
rvm.converter.binary=/opt/datahub/bin/rvm-converter
# Generous next to the tens of milliseconds a real model takes, so only a converter that has
# genuinely stopped is killed.
rvm.converter.timeout=PT5M
