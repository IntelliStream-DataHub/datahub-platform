# Use trace if you want to see parameter binding
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: OFF
    org.hibernate.orm.jdbc.bind: info
    org:
      hibernate:
        type: info
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

postgres:
  datasource:
    driverClassName: org.postgresql.Driver
    dialect: org.hibernate.dialect.PostgreSQLDialect
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20

vault:
  address: https://vault.example.com
  role-id: changeme
  secret-id: changeme

datahub:
  flyway:
    per-tenant-migrate: true

# CORS: browser origins allowed to call the API directly (e.g. the datahub-console,
# which now fetches recommend-value-type straight from the browser). Comma-separated;
# set this to the console's public origin(s).
origins: https://console.example.com
