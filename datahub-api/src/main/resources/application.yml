spring:
  application:
    name: datahub-api
  ai:
    mcp:
      server:
        name: datahub-mcp-server-dev
        protocol: STATELESS
        base-url: /mcp
        version: 1.0.0
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: false
  #profiles:
    # Change to prod when running in production
  #  active: dev
  devtools:
    restart:
      enabled: false
      #poll-interval: '500ms'
      #quiet-period: '200ms'
  # Static resources reloading during development
  web:
    resources:
      static-locations: 'classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/'
      cache:
        period: 0
    locale: 'en-US'
    locale-resolver: fixed
  mvc:
    static-path-pattern: /static/**
  jackson:
    datetime-feature:
      write-dates-as-timestamps: false
  datasource:
    type: org.springframework.jdbc.datasource.SimpleDriverDataSource
  jpa:
    database: default
    show-sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      # New entries will be invalid @see PostgresDbConfig
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        cache:
          use_second_level_cache: false
          use_query_cache: false
        jdbc:
          lob:
            non_contextual_creation: false
          batch_size: 1000
        order_updates: true
        order_inserts: true
        format_sql: true
        generate_statistics: false
    open-in-view: false
  flyway:
    enabled: false

server:
  tomcat:
    # For the tomcat_connections and tomcat_threads metrics.
    mbeanregistry:
      enabled: true
    threads:
      max: 200
      min-spare: 5
  servlet:
    session:
      cookie:
        same-site: strict
  port: 8081

# Prometheus scrape endpoint, on a port of its own so the load balancer never reaches it.
#
# OFF by default. The scrape is unauthenticated, so whatever can reach the port reads request
# rates, error rates, the endpoint inventory and JVM internals. Turn it on only once the port is
# reachable from the Prometheus host alone. Prefer mutual TLS over trusting the firewall: set
# `metrics.keystore` and `metrics.truststore` (with their passwords) in the shared Vault secret and
# `management.server.ssl.*` is configured from them at startup, so only a Prometheus holding a certificate you
# issued can scrape. With no keystore in Vault the port stays plain HTTP.
# Read the security guidance first:
# https://intellistream.ai/data-platform-documentation/administration/monitoring#securing-the-endpoint
management:
  server:
    port: 9081
    # address: 10.0.0.5    # optional: bind one interface as well as requiring a certificate
  endpoints:
    web:
      exposure:
        # Add `prometheus` here to serve /actuator/prometheus.
        include: ""
  # Health is not exposed, and its auto-configured indicators cannot even be built: the tenant
  # routing datasource has no connection to probe without a tenant.
  health:
    defaults:
      enabled: false
springdoc:
  writer-with-order-by-keys: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    resolve-schema-properties: true
    enabled: true
    path: /api-docs
    version: OPENAPI_3_1

datahub:
  acl:
    groups:
      # Caching for the caller's Keycloak organization groups (the dataset grants), read from the
      # UserInfo endpoint. See datahub-api/KEYCLOAK_ORG_GROUPS.md.
      # l1-ttl:    in-process, keeps Valkey off the hot path for a burst of requests.
      # soft-ttl:  when to refresh. Bounds how long a revoked grant lives on the happy path.
      # stale-ttl: how long a FAILED refresh may keep serving the old answer, and the fail-closed
      #            deadline. Between soft and stale an identity-provider blip is invisible; past
      #            stale, requests are denied rather than trusting an increasingly old answer.
      #            One TTL cannot express both: failing closed at expiry makes Keycloak a hard
      #            dependency of every request whose entry just lapsed, and serving stale forever
      #            keeps revoked grants alive for the length of an outage.
      l1-ttl: 10s
      soft-ttl: 45s
      stale-ttl: 90s
      http-timeout: 3s
  flyway:
    per-tenant-migrate: true
  features:
    # Defaults for tenants whose Vault tenant-config block doesn't set the flag;
    # an explicit `policy`/`streaming` value in Vault overrides these per tenant.
    policy: true
    streaming: true
  limits:
    # Largest accepted request body, in bytes. This is the application's own ceiling, independent of
    # nginx: anything that can reach the service port would otherwise be unbounded. Over the limit is
    # a 413, which the SDK treats as terminal rather than retrying.
    # Kept under Pulsar's 5 MB per-message default — an event create batch is published as one
    # message, so this is what keeps that message legal.
    # 0 or negative disables the check.
    max-body-bytes: 4194304
    # POST /timeseries/data only. Higher because a full 100 000-point numeric batch is around 5 MB of
    # JSON by itself, and a maxed-out text batch around 11 MB.
    max-body-bytes-datapoints: 16777216
    # How long a tenant's tenant_limits row is cached in-process. Also the propagation delay: an
    # UPDATE to that table takes effect across every instance within this window, no restart needed.
    cache-ttl: 5m
    rate:
      # Requests per minute, counted in a fixed window per tenant and per user. Over the budget is a
      # 429 with Retry-After; the SDK already treats that as retryable and backs off.
      # A tenant's tenant_limits row overrides any of these. 0 or negative disables one.
      # If Valkey is unreachable the limiter allows traffic through rather than refusing it.
      enabled: true
      # The tenant is the real budget — a public signup gets an organization of its own. The
      # per-user figures stop a single identity inside a tenant spending all of it.
      write-per-minute-per-tenant: 2000
      read-per-minute-per-tenant: 6000
      write-per-minute-per-user: 600
      read-per-minute-per-user: 1200
    quota:
      # Daily ingest allowance per tenant, reset at 00:00 UTC. Over it is a 429 with Retry-After
      # pointing at midnight, which the SDK spools and replays. Counted in memory and flushed to
      # Valkey every couple of seconds, so a tenant can overshoot slightly across instances — these
      # are ceilings, not invoices.
      enabled: true
      events-per-day: 100000
      # Resources, time series, data sets, labels, policies and functions are all rows in the node
      # table, so they share one allowance.
      nodes-per-day: 50000
      edges-per-day: 100000
      datapoints-per-day: 10000000
      # Bytes of write-request body. The one quota that really bounds storage growth: an entity
      # count does not, because a single legal entity can be a few hundred KB.
      ingest-bytes-per-day: 1073741824
    lifetime:
      # How large a tenant may grow, rather than how fast. Over one of these is a 403 saying how it
      # is raised: waiting will not clear it, so it is not a 429.
      #
      # OFF by default, unlike the rate limits and daily quotas, because these numbers size a free
      # playground rather than a real deployment. Switching this on applies them to every tenant
      # that has no tenant_limits override, so a tenant already holding more than max-resources
      # would start refusing writes the moment the api restarted. Give the tenants that should keep
      # growing a 0 in their tenant_limits row FIRST, then enable this.
      enabled: false
      # Counted live against the node table, so deleting frees room again.
      max-resources: 1000
      max-events-total: 25000
      max-datapoints-total: 1000000000
      # Text and mixed series are the expensive kind to store and query, so they are capped well
      # below the numeric total.
      max-text-datapoints-total: 100000
    websocket:
      # Concurrent sockets, and subscriptions multiplexed over one of them. Capped separately from
      # requests because a socket's cost is what follows the handshake: a durable subscription holds
      # broker resources whether or not anyone reads it, so an idle hoard costs as much as a busy one
      # and the per-minute rate limit never sees it. Over the cap gets an error frame naming the
      # limit and a 1008 close. The socket counts are per-tenant overridable via tenant_limits.
      enabled: true
      max-sockets-per-tenant: 10
      max-sockets-per-user: 10
      max-subscriptions-per-socket: 10
  files:
    checksum:
      # Checksum algorithm applied to every uploaded file.
      # One of: SHA-256 (default), SHA-1, SHA-512, BLAKE3.
      algorithm: SHA-256
    upload:
      # Read/write/hash block size for the upload, in bytes. Larger blocks mean fewer, larger
      # writes; the 1 MB default lines up with a typical NFS wsize.
      buffer-size: 1048576
