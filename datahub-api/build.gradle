plugins {
	id 'ai.intellistream.datahub.java-common-conventions'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'

	// Run with ./gradlew --console plain jshell
	// Great to generate ids with for example: IdGenerator.xxHash("temperature:deg_c")
	id "com.github.mrsarm.jshell.plugin" version "1.2.1"
}

group = 'ai.intellistream.datahub.api'
version = '0.0.1-SNAPSHOT'


configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation project(':datahub-infra')
	implementation project(':datahub-commons')
	testImplementation project(':datahub-infra')

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation 'net.openhft:zero-allocation-hashing:0.27ea0'
	implementation("org.apache.pulsar:pulsar-client-admin:${pulsarVersion}"){
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}
	implementation("org.apache.pulsar:pulsar-client-admin-api:${pulsarVersion}"){
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}
	implementation("org.apache.pulsar:pulsar-client:${pulsarVersion}") {
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}
	implementation ("org.apache.pulsar:pulsar-client-api:${pulsarVersion}"){
		exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	}

	// Vault client
	implementation 'io.github.jopenlibs:vault-java-driver:6.2.3'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'com.jayway.jsonpath:json-path:3.0.0'
	implementation "tools.jackson.dataformat:jackson-dataformat-xml:${jacksonVersion}"
	implementation "tools.jackson.core:jackson-databind:${jacksonVersion}"

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Prometheus scrape endpoint (/actuator/prometheus on the management port).
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// Flyway (core + postgres provider) and the migration scripts come transitively from
	// datahub-infra, which owns per-tenant migration. The api runs it via TenantMigrationService;
	// Boot's own Flyway autoconfig stays disabled (spring.flyway.enabled=false).
	implementation 'org.springframework.session:spring-session-core'

	// MCP server — Spring AI's WebMVC transport serves /mcp/* as normal Spring MVC
	// endpoints, so the existing OAuth2 SecurityFilterChain (JWT + OrganizationValidator)
	// authenticates + establishes TenantContext before any @Tool method runs. No custom
	// auth wiring needed.
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
	testImplementation 'org.testcontainers:pulsar:1.21.4'
	testImplementation 'org.testcontainers:postgresql:1.21.4'
	// SharedPostgres: one migrated PostgreSQL container shared across the integration tests.
	testImplementation testFixtures(project(':datahub-infra'))
	// @DataJpaTest and @AutoConfigureTestDatabase live in these Boot 4 slices, which the base
	// starter-test does not pull in.
	testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-jdbc-test'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	// Keep the default `test` task runnable without a container runtime: the @Tag("integration")
	// Pulsar/WebSocket tests run only under the dedicated `integrationTest` task below.
	useJUnitPlatform { excludeTags 'integration' }
	// Activate the `test` profile so `application-test.yml` (vault creds, test datasource
	// pool sizing) layers on top of the base config. Without this Spring won't resolve
	// `${vault.address}` because none of the profile-specific application-*.yml files
	// load by default.
	systemProperty 'spring.profiles.active', 'test'
}

// Integration tests that require a container runtime (Podman or Docker). They spin up an Apache
// Pulsar standalone broker with the datahub-pulsar-filter NAR loaded, so the broker-side
// subscription filtering is exercised for real.
//
//   ./gradlew :datahub-api:integrationTest
//
tasks.register('integrationTest', Test) {
	description = 'Runs @Tag("integration") Pulsar/WebSocket tests (require Podman/Docker).'
	group = 'verification'
	useJUnitPlatform { includeTags 'integration' }
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')

	// Build and hand the broker-side entry-filter NAR to the tests so they can mount it into the
	// Pulsar container.
	def narTask = project(':datahub-pulsar-filter').tasks.named('nar')
	dependsOn narTask
	systemProperty 'datahub.pulsar.image.version', project.findProperty('pulsarVersion') ?: '4.0.11'
	doFirst {
		systemProperty 'datahub.pulsar.filter.nar', narTask.get().archiveFile.get().asFile.absolutePath
	}

	// Point Testcontainers at the rootless Podman socket when DOCKER_HOST isn't already set, and
	// disable the Ryuk reaper (it does not work under rootless Podman; the test JVM stops the
	// container via a shutdown hook instead).
	if (!System.getenv('DOCKER_HOST')) {
		def uid = ['id', '-u'].execute().text.trim()
		def podmanSocket = "/run/user/${uid}/podman/podman.sock"
		if (file(podmanSocket).exists()) {
			environment 'DOCKER_HOST', "unix://${podmanSocket}"
		}
	}
	environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
}

