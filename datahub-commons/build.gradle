/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'ai.intellistream.datahub.java-library-conventions'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}


dependencies {

    // The lean wire-contract module. Exposed with `api` so the DTO/form/envelope
    // types it owns (same packages as before the extraction) remain transitively
    // visible to every module that depends on datahub-commons — no import changes.
    api project(':datahub-api-model')

    // Vault client
    implementation 'io.github.jopenlibs:vault-java-driver:6.2.0'

    // Open Feign
    implementation group: 'io.github.openfeign', name: 'feign-core', version: feignVersion
    implementation group: 'io.github.openfeign', name: 'feign-jackson', version: feignVersion
    implementation "io.github.openfeign:feign-java11:${feignVersion}"
    implementation "tools.jackson.dataformat:jackson-dataformat-xml:${jacksonVersion}"
    implementation "tools.jackson.core:jackson-databind:${jacksonVersion}"

    implementation 'net.openhft:zero-allocation-hashing:0.27ea0'
    // UUID v7
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'

    // Blake3
    implementation 'commons-codec:commons-codec:1.21.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // OpenAPI/Swagger annotations only (e.g. @Schema on DTOs). The full springdoc
    // starter (Spring MVC + Swagger UI) belongs in the web app modules, not in this leaf.
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.47'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Servlet API for HttpHelper, compile-only: provided at runtime by the web app
    // modules (datahub-api, datahub-console). Headless consumers never call HttpHelper.
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}


// Library module: no main class, so don't build an executable boot jar.
bootJar { enabled = false }
jar { enabled = true; archiveClassifier = '' }
