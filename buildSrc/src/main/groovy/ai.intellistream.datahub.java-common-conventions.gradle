/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    // Apply the java Plugin to add support for Java.
    id 'java'
}

// Single source of truth for the Java toolchain. Every module inherits this by applying a
// convention plugin (this one directly, or java-library-/java-application-conventions which
// apply it). Bump the Java version here, not in individual module build.gradle files.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    constraints {
        // Define dependency versions as constraints
        implementation 'org.apache.commons:commons-text:1.15.0'
    }

    // JUnit Jupiter. Version is left unmanaged here so modules that apply the Spring Boot BOM
    // (everything except datahub-pulsar-filter) inherit Boot's tested JUnit 6 version. Modules
    // without the BOM pin the JUnit BOM themselves (see datahub-pulsar-filter/build.gradle).
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
