# intellistream-flow: runs flows. An OAuth2 resource server like the api, resolving the tenant from
# the caller's token; its tables live in each tenant's Postgres (schema `flow`). The issuer-uri is
# loaded from Vault at startup (VaultConfigurationLoader) from the shared "datahub-platform" secret,
# so the Vault connection (vault.address/role-id/secret-id) is supplied per profile — see
# application-dev.properties.example / application-prod.properties. Run with
# SPRING_PROFILES_ACTIVE=dev|prod.
spring.application.name=datahub-flow
server.port=8084
# Prometheus scrape endpoint, on a port of its own so the load balancer never reaches it.
#
# OFF by default. The scrape is unauthenticated, so whatever can reach the port reads request
# rates, error rates, the endpoint inventory and JVM internals. Turn it on only once the port is
# reachable from the Prometheus host alone. Prefer mutual TLS over trusting the firewall: set
# `metrics.keystore` and `metrics.truststore` (with their passwords) in the shared Vault secret and
# `management.server.ssl.*` is configured from them at startup, so only a Prometheus holding a certificate you
# issued can scrape. With no keystore in Vault the port stays plain HTTP.
# Read the security guidance first:
# https://intellistream.ai/data-platform-documentation/administration/monitoring#securing-the-endpoint
management.server.port=9086
# management.server.address=10.0.0.5   # narrow from the wildcard to an internal interface
# Add `prometheus` to serve /actuator/prometheus.
management.endpoints.web.exposure.include=
# The tenant routing datasource has no connection to probe without a tenant.
management.health.defaults.enabled=false
# For the tomcat_connections and tomcat_threads metrics.
server.tomcat.mbeanregistry.enabled=true

# The console's Flows section calls this service directly from the console origin, so allow it via
# CORS (comma-separated; override per environment).
cors.allowed-origins=http://localhost:8080

# datahub-api, which this service asks what a caller may do (GET /me/grants, /me/datasets) and
# calls as the caller to resolve datasets and create the series a flow declares.
datahub.api.url=http://localhost:8081

# Deploying a flow sends the browser to Keycloak and back to this service's callback, at
# <public-url>/flows/deployment/callback (registered as a redirect URI on the intellistream-flow
# client), and from there on to the flow's page in the console. With console-url empty the callback
# shows a short page of its own instead. The client's id and secret come from Vault (flow.client-id,
# flow.client-secret in datahub-platform).
datahub.flow.public-url=http://localhost:8084
datahub.flow.console-url=http://localhost:8080

# datahub-infra brings Hibernate along, but this service has no entities: it talks to the flow
# tables with JdbcTemplate. Left on, Hibernate would also try to reach a database at startup, where
# there is no tenant to route to.
spring.autoconfigure.exclude=\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.metrics.HibernateMetricsAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

# springdoc arrives with datahub-infra. This service publishes no OpenAPI document (yet).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# What the runs on one instance may hold at once, on the heap, split evenly over the run slots
# (datahub.flow.runs.max-running, below): with the defaults and a 16 GB heap each run may hold
# 1 GB. A flow never says how much memory it needs. Unset, half the maximum heap; more than half,
# or a share under 64 MB per run, and the service refuses to start: size it with -Xmx, or lower
# max-running.
#datahub.flow.runs.memory-budget=1GB

# Each flow tenant's records topic, <pulsar-tenant>/flow/records (RecordsTopicProvisioner). When the
# backlog reaches either limit, publishing fails and that tenant's runs fail rather than lose
# records. Retention keeps acknowledged records a while for replay; Pulsar requires it to exceed the
# backlog limits, in size and in time.
datahub.flow.records.backlog-size=1GB
datahub.flow.records.backlog-age=7d
datahub.flow.records.retention-size=2GB
datahub.flow.records.retention-time=8d
# How often to look for tenants whose flow flag has been switched on since startup.
datahub.flow.records.provision-interval=PT5M
# A run attempt keeps at most this many records; beyond it they are dropped and a marker row says
# so. A run finishes only once Pulsar has acknowledged its records, waiting its remaining time but
# at least ack-wait.
datahub.flow.records.max-per-run=100000
datahub.flow.records.ack-wait=PT30S
# Every instance consumes every provisioned tenant topic into that tenant's ClickHouse. A batch
# whose insert failed comes back after the redelivery delay; new tenant topics are picked up at the
# consumer interval.
datahub.flow.records.redelivery-delay=PT5S
datahub.flow.records.consumer-interval=PT30S
# A run's live view (GET /runs/{id}/events) reads the run and its new records this often. It stays
# open for the run's timeout and a little more, so asynchronous requests may outlive the default.
datahub.flow.records.live-poll=PT1S
spring.mvc.async.request-timeout=PT75M

# How the instances share the runs (RunCoordinator). The sweep, every sweep-interval on every
# instance, turns due schedule ticks into pending runs and tells the dispatcher to look at every
# tenant: it is how a changed schedule or deployment, or runs another instance queued, are noticed,
# so it can be slow. Starting runs does not wait for it: the dispatcher refills a run slot the
# moment a run finishes and starts runs the moment they are queued here, so a queue of thousands
# drains as fast as the slots allow. A claimed run holds a lease in Postgres, renewed every
# heartbeat; one that is not renewed in time is taken back by the reaper on any instance and run
# again. Shorter leases notice a dead instance sooner, at the cost of more heartbeat statements.
datahub.flow.runs.sweep-interval=PT10S
datahub.flow.runs.heartbeat-interval=PT15S
datahub.flow.runs.reaper-interval=PT30S
datahub.flow.runs.lease=PT60S
# Runs this instance executes at once: how fast a queue drains is this divided by how long a run
# takes. Free slots are filled from every tenant with pending runs, each tenant taking an equal
# share of what is left at its turn and a different tenant going first each round. The run memory
# budget (above) is split evenly over these slots, so this also sets how much memory one run may
# hold: more slots, faster queue, less memory each.
datahub.flow.runs.max-running=8
# Missed ticks created per flow per sweep after the service was down, oldest first.
datahub.flow.runs.catch-up=24
# The wait before a failed attempt's retry, doubling per attempt up to the maximum.
datahub.flow.runs.backoff=PT30S
datahub.flow.runs.max-backoff=PT15M
# Every DataHub request a run makes times out after this. It is also the lease fence's margin: a run
# sends nothing whose request could outlast its lease, so it must stay below lease - heartbeat.
datahub.flow.runs.request-timeout=PT30S
