# /etc/systemd/system/nginx.service.d/override.conf
#
# worker_rlimit_nofile in nginx.conf raises each worker's soft limit, but not past the
# hard limit the service starts with. Lift the ceiling for the whole service so the
# master can hand every worker its million descriptors. Apply with
# "systemctl daemon-reload && systemctl restart nginx".
[Service]
LimitNOFILE=2097152
