# DataHub Platform: nginx load balancer site (AlmaLinux / RHEL)
#
# Fronts two instances each of datahub-api (api.example.org) and datahub-console
# (console.example.org) with plain round-robin. Neither service needs sticky sessions:
# the api is stateless (JWT, WebSocket cursors live in Pulsar) and the console keeps its
# session in Valkey/Redis. See README.md, "Deployment & Scaling", and nginx/README.md for
# the install steps and the tuning rationale.
#
# Pairs with the nginx.conf next to it (worker, connection and socket-level tuning) and
# sysctl.d/ (kernel side: a baseline plus one file for the uplink speed, 1 or 10 Gbit/s).
# It also works on a stock nginx.conf, just with the stock connection limits.
#
# TLS is configured per server block to the SSL Labs A+ bar: TLS 1.2/1.3 only,
# forward-secret AEAD ciphers, session tickets off, OCSP stapling, HSTS. The certificate
# still has to come from a trusted CA with a 2048-bit RSA or P-256 key or better; a
# self-signed one caps the grade at T regardless of these settings.
#
# Open-source nginx only does passive health checks (max_fails / fail_timeout below):
# an instance is skipped after it fails, not probed ahead of time. nginx Plus or an
# external checker is needed for active probes.
#
# Compression: off here on purpose. The apps gzip their own JSON/HTML (server.compression
# in systemd/config), which spreads that CPU over the app hosts and keeps the edge box
# free for TLS and copying bytes. nginx passes Content-Encoding through untouched.
#
# Install: /etc/nginx/conf.d/datahub.conf. See nginx/README.md for the full sequence,
# including the SELinux boolean without which every proxy_pass fails.
#
# Distro notes
#   - SELinux confines nginx as httpd_t. Without "setsebool -P httpd_can_network_connect 1"
#     every proxy_pass fails with "Permission denied" (502). Certificates under
#     /etc/letsencrypt and /etc/pki are already labelled cert_t; any other location needs
#     semanage fcontext -a -t cert_t '/path/to/certs(/.*)?' && restorecon -Rv /path/to/certs
#   - The stock /etc/nginx/nginx.conf keeps a catch-all "server_name _" block on port 80;
#     it does not clash with the named hosts below. The tuned nginx.conf next to this file
#     drops it.
#   - System-wide crypto policy (update-crypto-policies --show) filters ssl_ciphers on top
#     of what is listed here. DEFAULT keeps every suite below; FUTURE drops the two
#     AES-128 suites, which is fine.
#   - "http2 on" needs nginx 1.25.1+, so the 1.26 AppStream stream. On the 1.24 stream or
#     AlmaLinux 8, replace the two "http2 on;" lines with "listen 443 ssl http2;" (keep
#     the reuseport/backlog options on the api block).

# ---------------------------------------------------------------------------------------
# Access log format and WebSocket upgrade map
# ---------------------------------------------------------------------------------------
# Defined here rather than in nginx.conf so this file also works with a stock nginx.conf.
# Upstream address and timings are what you want when one instance misbehaves.
log_format datahub_lb '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'up=$upstream_addr rt=$request_time urt=$upstream_response_time '
                      '$ssl_protocol/$ssl_cipher';

# With an Upgrade header the client connection becomes "Connection: upgrade"; without one
# the proxied connection is closed normally.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------------------
# Upstreams (round-robin is nginx's default balancing method)
# ---------------------------------------------------------------------------------------
# keepalive is the number of idle connections each WORKER keeps to the group, so the real
# pool is keepalive x worker_processes. keepalive_timeout here must stay BELOW Tomcat's
# keep-alive-timeout (75s in the Spring Boot tuning under systemd/config) so nginx, not
# Tomcat, closes an idle connection; the other way round produces sporadic 502s when nginx
# reuses a socket Tomcat is closing at the same moment.
#
# Address family: nginx resolves these names once, at start, and turns EVERY address into
# a peer. A name with both an A and an AAAA record therefore becomes two peers for one
# instance, and round-robin sends it twice its share. Give the internal names one record
# each, or write literal addresses: "server [fd00:10::21]:8081;". Either family works; the
# api's internal-proxies list (systemd/config) must then contain the LB address of the
# family nginx actually connects from.
upstream datahub_api {
    server api1.internal.example.org:8081 max_fails=3 fail_timeout=10s;
    server api2.internal.example.org:8081 max_fails=3 fail_timeout=10s;

    keepalive          128;
    keepalive_requests 10000;
    keepalive_timeout  30s;
}

upstream datahub_console {
    server console1.internal.example.org:8080 max_fails=3 fail_timeout=10s;
    server console2.internal.example.org:8080 max_fails=3 fail_timeout=10s;

    keepalive          64;
    keepalive_requests 10000;
    keepalive_timeout  30s;
}

# ---------------------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.example.org console.example.org;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------------------
# api.example.org -> datahub-api
# ---------------------------------------------------------------------------------------
server {
    # Dual stack: one socket per family. nginx binds [::] with ipv6only=on, so the two
    # lines never collide and each family gets its own reuseport group and backlog.
    # reuseport gives every worker its own listening socket, so the kernel spreads new
    # connections across workers instead of waking them all. backlog needs
    # net.core.somaxconn at least this high (sysctl.d/90-datahub-lb.conf). Both options
    # describe the socket itself, so nginx accepts them on only one server block per
    # address; the console server below inherits them.
    listen 443 ssl reuseport backlog=65535;
    listen [::]:443 ssl reuseport backlog=65535;
    http2 on;
    server_name api.example.org;

    # Certbot layout (certbot --nginx or --webroot; adjust for another CA). Assumes one
    # certificate with both hostnames as SANs (or a wildcard), shared with the console
    # block below: see nginx/README.md, "What the site file does". For a separately
    # issued certificate per host instead, point ssl_certificate, ssl_certificate_key
    # and ssl_trusted_certificate at /etc/letsencrypt/live/api.example.org/.
    # Keep them under /etc/letsencrypt or /etc/pki so SELinux labels them cert_t.
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    # --- TLS policy (SSL Labs A+) ---------------------------------------------------
    # TLS 1.2 and 1.3 only, with ECDHE AEAD suites: every connection gets forward
    # secrecy and no CBC, RC4, 3DES or DHE suite is offered (no dhparam file needed).
    # TLS 1.3 suites are fixed by OpenSSL and not listed here. Client preference is
    # honoured, as Mozilla's intermediate profile recommends, since every suite below
    # is strong and the client knows best which one it has hardware support for.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;

    # Session resumption through the server-side cache only (64m holds roughly a quarter
    # of a million sessions, shared by all workers and both server blocks). Tickets are
    # off because a long-lived ticket key undermines forward secrecy and is not shared
    # between two nginx instances anyway.
    ssl_session_cache   shared:SSL:64m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling: saves the client a round trip to the CA. Needs the issuer chain and
    # a resolver, reachable over whichever family the host has (replace the public ones
    # with your own). Harmless if the certificate carries no OCSP URL (Let's Encrypt
    # stopped issuing them in 2025); nginx logs a warning at startup and carries on.
    ssl_stapling            on;
    ssl_stapling_verify     on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.org/chain.pem;
    resolver                1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001] valid=300s;
    resolver_timeout        5s;

    # HSTS: the A+ requirement on top of an A. Two years, subdomains included, sent on
    # error responses too ("always"). Add "; preload" once the domain is ready for the
    # browser preload list; that is hard to undo, so it is left out here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # --------------------------------------------------------------------------------
    access_log /var/log/nginx/api.example.org.access.log datahub_lb buffer=256k flush=5s;
    error_log  /var/log/nginx/api.example.org.error.log warn;

    # Not sized for the token: the dataset grants are read from UserInfo rather than
    # carried in it (datahub-api/KEYCLOAK_ORG_GROUPS.md), so a Keycloak access token here
    # is a few KB and fits the 8k default comfortably. What can actually get long is the
    # request line of the live-tail WebSocket, which carries the token as ?token= plus a
    # comma-separated externalIds list. Tomcat is raised to match
    # (server.max-http-request-header-size in the Spring Boot tuning).
    large_client_header_buffers 4 16k;

    # Default body cap for REST calls (datapoint and event batches, resource payloads).
    # File uploads are exempted in the /files location below.
    client_max_body_size 64m;

    # Headers every proxied request carries. The api reads X-Forwarded-For for request
    # logging; Host and X-Forwarded-Proto keep generated URLs (Swagger UI) correct.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;

    # Retry the other instance if one refuses the connection or times out connecting.
    # Only idempotent methods are retried after a partial send (nginx default), so a
    # half-delivered POST is never replayed.
    proxy_next_upstream error timeout http_502 http_503;

    # WebSocket endpoints, both under this prefix:
    #   /timeseries/datapoints/subscription/listen/**  (durable subscriptions, Bearer JWT)
    #   /timeseries/datapoints/listen                  (browser live tail, ?token=)
    # The plain REST endpoints under /timeseries/... do not match this location.
    location /timeseries/datapoints/ {
        proxy_pass http://datahub_api;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Sockets are long-lived; the api sends pings, so an hour of silence is an error.
        # TCP keepalive on the upstream leg spots a dead api instance behind a quiet
        # socket instead of waiting for the read timeout.
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_socket_keepalive on;
        proxy_buffering        off;
    }

    # File storage. Uploads are a single raw PUT streamed straight into storage, and
    # downloads stream back the same way, so nginx must neither cap the body nor spool it
    # to a temp file in between.
    location /files {
        proxy_pass http://datahub_api;
        proxy_set_header Connection "";

        client_max_body_size    0;
        proxy_request_buffering off;
        proxy_buffering         off;

        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Everything else: plain REST, Swagger UI, MCP.
    location / {
        proxy_pass http://datahub_api;
        proxy_set_header Connection "";

        # Enough buffer to absorb a typical JSON response in memory so the upstream
        # connection is released quickly, but never spill a large one to disk: with
        # proxy_max_temp_file_size 0 nginx streams it through instead, at the pace of
        # the client. Disk spooling would make local disk the ceiling, not the uplink.
        proxy_buffer_size        32k;
        proxy_buffers            32 32k;
        proxy_busy_buffers_size  64k;
        proxy_max_temp_file_size 0;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ---------------------------------------------------------------------------------------
# console.example.org -> datahub-console
# ---------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.org;

    # Certbot layout (certbot --nginx or --webroot; adjust for another CA). Assumes one
    # certificate with both hostnames as SANs (or a wildcard), shared with the api block
    # above: see nginx/README.md, "What the site file does". For a separately issued
    # certificate per host instead, point ssl_certificate, ssl_certificate_key and
    # ssl_trusted_certificate at /etc/letsencrypt/live/console.example.org/.
    # Keep them under /etc/letsencrypt or /etc/pki so SELinux labels them cert_t.
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    # --- TLS policy (SSL Labs A+) ---------------------------------------------------
    # TLS 1.2 and 1.3 only, with ECDHE AEAD suites: every connection gets forward
    # secrecy and no CBC, RC4, 3DES or DHE suite is offered (no dhparam file needed).
    # TLS 1.3 suites are fixed by OpenSSL and not listed here. Client preference is
    # honoured, as Mozilla's intermediate profile recommends, since every suite below
    # is strong and the client knows best which one it has hardware support for.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;

    # Session resumption through the server-side cache only (64m holds roughly a quarter
    # of a million sessions, shared by all workers and both server blocks). Tickets are
    # off because a long-lived ticket key undermines forward secrecy and is not shared
    # between two nginx instances anyway.
    ssl_session_cache   shared:SSL:64m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling: saves the client a round trip to the CA. Needs the issuer chain and
    # a resolver, reachable over whichever family the host has (replace the public ones
    # with your own). Harmless if the certificate carries no OCSP URL (Let's Encrypt
    # stopped issuing them in 2025); nginx logs a warning at startup and carries on.
    ssl_stapling            on;
    ssl_stapling_verify     on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.org/chain.pem;
    resolver                1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001] valid=300s;
    resolver_timeout        5s;

    # HSTS: the A+ requirement on top of an A. Two years, subdomains included, sent on
    # error responses too ("always"). Add "; preload" once the domain is ready for the
    # browser preload list; that is hard to undo, so it is left out here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # --------------------------------------------------------------------------------
    access_log /var/log/nginx/console.example.org.access.log datahub_lb buffer=256k flush=5s;
    error_log  /var/log/nginx/console.example.org.error.log warn;

    # Session cookie and the OAuth2 redirect are all this vhost sees; the 8k default would
    # do, and this is only headroom for an unusually long Referer.
    large_client_header_buffers 4 16k;

    # The console only serves HTML, forms and its own static assets; uploads and
    # WebSockets go from the browser straight to api.example.org.
    client_max_body_size 16m;

    # The console runs with server.forward-headers-strategy=framework, so these headers
    # are what make the OAuth2 redirect URI and absolute links come out as
    # https://console.example.org/... instead of http://console1:8080/...
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503;

    # Let the console's own cookie and redirect logic through untouched; the forwarded
    # headers above already make it produce the external scheme and host.
    proxy_redirect off;

    location / {
        proxy_pass http://datahub_console;

        proxy_buffer_size        16k;
        proxy_buffers            16 16k;
        proxy_max_temp_file_size 0;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
