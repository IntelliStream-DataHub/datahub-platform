# DataHub Platform: load balancer kernel tuning, 10 Gbit/s uplink
#
# Install as /etc/sysctl.d/91-datahub-lb-10g.conf NEXT TO 90-datahub-lb.conf (the
# baseline), instead of the 1g file, when the uplink is upgraded. Just
# "rm the 1g file, copy this one in, sysctl --system"; nothing else changes.
#
# Same reasoning as the 1g file: 10 Gbit/s x 50 ms ~= 62 MB, round up to 64 MB. Below
# this speed the request rate itself can also start to matter (NIC ring/queue tuning via
# ethtool), but that is hardware-specific and not a sysctl.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem  = 4096 87380 67108864
net.ipv4.tcp_wmem  = 4096 65536 67108864
