# DataHub Platform: load balancer kernel tuning, 1 Gbit/s uplink
#
# Install as /etc/sysctl.d/91-datahub-lb-1g.conf NEXT TO 90-datahub-lb.conf (the
# baseline), instead of the 10g file.
#
# Only the TCP autotuning ceiling: for one stream to reach line rate over a real WAN
# round trip, the socket buffer has to hold the whole bandwidth-delay product, and the
# kernel's own default ceiling (a few MB) is smaller than that once RTT gets past a few
# tens of milliseconds. This matters for a single large flow, a /files upload or
# download, not for the many small keep-alive/WebSocket connections, which stay tiny
# either way. 1 Gbit/s x 100 ms ~= 12.5 MB; round up to 16 MB.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem  = 4096 87380 16777216
net.ipv4.tcp_wmem  = 4096 65536 16777216
