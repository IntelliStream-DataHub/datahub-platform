# DataHub Platform: kernel tuning for the nginx load balancer host (baseline)
#
# Install as /etc/sysctl.d/90-datahub-lb.conf and apply with "sysctl --system". Same file
# for Debian and AlmaLinux, dual stack.
#
# Deliberately short: modern kernel defaults (Debian 13 / AlmaLinux 9 and newer) are
# already sized well for a busy server, so this only overrides what our own nginx config
# actually depends on. Pair with ONE of 91-datahub-lb-1g.conf / -10g.conf for the uplink.
#
# The 91- files assume a dedicated NIC with a guaranteed line rate. On virtualized or
# shared-tenancy hosting, that assumption does not hold, see nginx/README.md,
# "Sizing this for cloud or shared-tenancy hosting".

# nginx's api vhost sets "backlog=65535" on its listen directives. The kernel silently
# caps any listen backlog at somaxconn, so without raising it that setting does nothing
# and reconnect bursts (e.g. right after a deploy) get dropped instead of queued. Modern
# kernels already default this to 4096; raise it to match what nginx asks for.
net.core.somaxconn = 65535

# IPv6 router advertisements and autoconf (SLAAC) are left at the kernel default (on),
# deliberately not turned off here. Disabling them ("net.ipv6.conf.all.accept_ra = 0" and
# the like) is sometimes recommended for a server with a single, manually assigned static
# address, so a router on the segment cannot silently add a route or a second address.
# Do NOT apply that in the blanket "all"/"default" form without checking your topology
# first: on a host that is also a router or firewall, or a cloud instance whose primary
# NIC gets its own IPv6 prefix and default route via RA/SLAAC from the provider (common
# on AWS EC2 and others), disabling it on "all" removes YOUR OWN uplink connectivity, not
# just an nginx listener's address stability. If a specific interface is known to be
# LAN-side and statically addressed, scope it to that interface instead:
#   net.ipv6.conf.<iface>.accept_ra = 0
#   net.ipv6.conf.<iface>.autoconf  = 0
