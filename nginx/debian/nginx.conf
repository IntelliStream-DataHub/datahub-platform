# DataHub Platform: tuned /etc/nginx/nginx.conf (Debian / Ubuntu)
#
# Replaces the distro's nginx.conf on a dedicated load balancer. Everything host-wide
# that a site file cannot set (worker count, per-worker connection limit, file
# descriptors, client-side keep-alive, buffered logging) lives here; the DataHub vhosts
# are in datahub.conf. Kernel-side limits come from sysctl.d/ (90-datahub-lb.conf plus the
# 91- file for the uplink speed) and the file-descriptor ceiling for the service from
# systemd/nginx.service.d/override.conf. Nothing in this file depends on the link speed:
# it is all sized by connection count, so a 1 to 10 Gbit/s upgrade leaves it untouched.
#
# Sizing: worker_processes auto x worker_connections 65536. Every proxied client costs
# two connections (client and upstream) and two descriptors, so a 36-thread box ends up
# allowing roughly a million concurrent sockets before nginx refuses; the kernel and
# RAM (about 20 KB per idle TLS connection) run out first.

user              www-data;
worker_processes  auto;
worker_cpu_affinity auto;

# Per-worker descriptor limit, raised by the master at start. Needs the matching
# LimitNOFILE in the systemd unit, or the hard limit stops it short.
worker_rlimit_nofile 1048576;

# On reload, old workers keep serving their open WebSocket connections. Without a bound
# they could linger for hours; after this long they close what is left, and clients
# reconnect to a new worker (the api resumes them from Pulsar).
worker_shutdown_timeout 600s;

pid       /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 65536;
    # Accept every pending connection in one wake-up instead of one per event loop turn.
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Site files define their own log_format (datahub_lb) and buffered access_log; this
    # is for anything that does not match a DataHub host.
    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

    # Byte pushing. sendfile only matters for the few static responses nginx serves
    # itself; tcp_nopush fills packets, tcp_nodelay flushes the tail of a response.
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Client-side keep-alive: SDK clients and browsers reuse connections across many
    # calls, so allow plenty of requests per connection and a generous idle time. Drop
    # the state for clients that time out without saying goodbye.
    keepalive_timeout          75s;
    keepalive_requests         10000;
    reset_timedout_connection  on;

    # Slow-client limits. client_body_timeout is between two successive reads, not the
    # whole upload, so a 10 GB PUT over a slow link is fine as long as data keeps moving.
    client_header_timeout 15s;
    client_body_timeout   60s;
    send_timeout          60s;

    # Request bodies up to this size stay in memory; larger REST bodies go through a
    # temp file (uploads under /files bypass buffering entirely, see datahub.conf).
    client_body_buffer_size 256k;

    # Hash sizes that stop nginx warning on hosts with a long mime.types or many names.
    types_hash_max_size          2048;
    server_names_hash_bucket_size 64;

    # No version string in error pages and the Server header.
    server_tokens off;

    # The apps compress their own responses (see systemd/config); do not gzip twice.
    gzip off;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
