# DataHub Platform: nginx load balancer site (Debian / Ubuntu)
#
# Fronts two round-robin instances each of datahub-api (api.example.org) and datahub-console (console.example.org); neither needs sticky sessions.
# See README.md, "Deployment & Scaling", and nginx/README.md for install steps and tuning rationale.
# Pairs with the nginx.conf and sysctl.d/ files next to it (worker/connection/socket and kernel tuning); also works with a stock nginx.conf.
# TLS is per server block, tuned to the SSL Labs A+ bar; needs a certificate from a trusted CA to actually score it.
# Health checks are passive only (max_fails/fail_timeout); nginx Plus or an external checker is needed for active probes.
# Compression is off here on purpose: the apps gzip their own responses (server.compression), keeping that CPU off the edge box.
# Install: /etc/nginx/sites-available/datahub.conf, symlinked into sites-enabled; see nginx/README.md for the full sequence.
#
# Distro notes
#   - Debian's stock nginx.conf already sets safe TLS defaults at http level; the blocks below override them anyway.
#   - "http2 on" needs nginx 1.25.1+ (Debian 13 has it); on Debian 12 / Ubuntu 24.04 use "listen 443 ssl http2;" instead.

# --- Access log format and WebSocket upgrade map ---
# Defined here, not nginx.conf, so this file also works with a stock nginx.conf; adds upstream address and timings to the log.
log_format datahub_lb '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'up=$upstream_addr rt=$request_time urt=$upstream_response_time '
                      '$ssl_protocol/$ssl_cipher';

# Turns an Upgrade header into "Connection: upgrade"; absent, the proxied connection just closes normally.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Upstreams (round-robin is nginx's default balancing method) ---
# keepalive is idle connections per WORKER (real pool is keepalive x worker_processes); keepalive_timeout must stay below Tomcat's (75s) so nginx closes idle connections first.
# A name resolving to both an A and AAAA record becomes two peers for one instance and skews round-robin; use one record per name, or a literal address, matching the api's internal-proxies family.
upstream datahub_api {
    server api1.internal.example.org:8081 max_fails=3 fail_timeout=10s;
    server api2.internal.example.org:8081 max_fails=3 fail_timeout=10s;

    keepalive          128;
    keepalive_requests 10000;
    keepalive_timeout  30s;
}

upstream datahub_console {
    server console1.internal.example.org:8080 max_fails=3 fail_timeout=10s;
    server console2.internal.example.org:8080 max_fails=3 fail_timeout=10s;

    keepalive          64;
    keepalive_requests 10000;
    keepalive_timeout  30s;
}

# Per-IP request budget for the api. The application limits per tenant and per user, but only once a
# token has been validated: this is what bounds the unauthenticated surface (JWT validation itself,
# /session, the WebSocket handshakes) where there is no identity to charge yet. 10m holds roughly
# 160k addresses. burst+nodelay absorbs a browser opening a page's worth of requests at once without
# turning it into a queue.
limit_req_zone $binary_remote_addr zone=dh_api_perip:10m rate=20r/s;
limit_req_status 429;

# --- HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.example.org console.example.org;

    return 301 https://$host$request_uri;
}

# --- api.example.org -> datahub-api ---
server {
    # Dual stack, reuseport per family; backlog needs net.core.somaxconn this high (sysctl.d/90-datahub-lb.conf); both options apply to the whole *:443 socket, so only set once.
    listen 443 ssl reuseport backlog=65535;
    listen [::]:443 ssl reuseport backlog=65535;
    http2 on;
    server_name api.example.org;

    # Assumes one certificate (SANs or wildcard) shared with the console block below; for a separate cert per host, point these at /etc/letsencrypt/live/api.example.org/ instead (nginx/README.md, "What the site file does").
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    # --- TLS policy (SSL Labs A+) ---
    # ECDHE AEAD suites only, TLS 1.2/1.3: forward secrecy, no CBC/RC4/3DES/DHE, client cipher preference honoured.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;

    # Session cache only (64m holds roughly a quarter million sessions); tickets off since a long-lived ticket key would undermine forward secrecy.
    ssl_session_cache   shared:SSL:64m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling saves the client a round trip; harmless if the certificate carries no OCSP URL, nginx just logs a warning.
    ssl_stapling            on;
    ssl_stapling_verify     on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.org/chain.pem;
    resolver                1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001] valid=300s;
    resolver_timeout        5s;

    # HSTS, two years with subdomains; "preload" left off until the domain is ready for the browser preload list (hard to undo).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    access_log /var/log/nginx/api.example.org.access.log datahub_lb buffer=256k flush=5s;
    error_log  /var/log/nginx/api.example.org.error.log warn;

    # Not for the token: dataset grants are read from UserInfo, so a Keycloak access token stays a few KB and fits the 8k default. It is the live-tail WebSocket, whose request line carries the token plus an externalIds list, that can get long. Tomcat matches (server.max-http-request-header-size).
    large_client_header_buffers 4 16k;

    # REST body cap; /files below is exempted for uploads. Kept above the api's own caps (4 MiB, and
    # 16 MiB for datapoint inserts) so an oversized request reaches the app and comes back as its
    # problem+json 413 naming the limit, rather than as nginx's bare HTML error page.
    client_max_body_size 20m;

    limit_req zone=dh_api_perip burst=40 nodelay;

    # Host/X-Forwarded-Proto keep generated URLs correct; X-Forwarded-For feeds the api's request logging.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;

    # Retries the other instance on connect failure; a partially sent POST is never replayed (nginx default).
    proxy_next_upstream error timeout http_502 http_503;

    # WebSocket endpoints: subscription/listen/** (durable, Bearer JWT) and listen (browser tail); plain REST under /timeseries/... doesn't match this prefix.
    location /timeseries/datapoints/ {
        proxy_pass http://datahub_api;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived sockets; TCP keepalive on the upstream leg spots a dead api instance without waiting for the read timeout.
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_socket_keepalive on;
        proxy_buffering        off;
    }

    # Uploads are one raw streamed PUT, so no body cap and no buffering to a temp file.
    location /files {
        proxy_pass http://datahub_api;
        proxy_set_header Connection "";

        client_max_body_size    0;
        proxy_request_buffering off;
        proxy_buffering         off;

        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Everything else: plain REST, Swagger UI, MCP.
    location / {
        proxy_pass http://datahub_api;
        proxy_set_header Connection "";

        # proxy_max_temp_file_size 0 streams large responses through instead of spooling to local disk.
        proxy_buffer_size        32k;
        proxy_buffers            32 32k;
        proxy_busy_buffers_size  64k;
        proxy_max_temp_file_size 0;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# --- console.example.org -> datahub-console ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.org;

    # Assumes one certificate (SANs or wildcard) shared with the api block above; for a separate cert per host, point these at /etc/letsencrypt/live/console.example.org/ instead (nginx/README.md, "What the site file does").
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    # --- TLS policy (SSL Labs A+) ---
    # ECDHE AEAD suites only, TLS 1.2/1.3: forward secrecy, no CBC/RC4/3DES/DHE, client cipher preference honoured.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;

    # Session cache only (64m holds roughly a quarter million sessions); tickets off since a long-lived ticket key would undermine forward secrecy.
    ssl_session_cache   shared:SSL:64m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling saves the client a round trip; harmless if the certificate carries no OCSP URL, nginx just logs a warning.
    ssl_stapling            on;
    ssl_stapling_verify     on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.org/chain.pem;
    resolver                1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001] valid=300s;
    resolver_timeout        5s;

    # HSTS, two years with subdomains; "preload" left off until the domain is ready for the browser preload list (hard to undo).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    access_log /var/log/nginx/console.example.org.access.log datahub_lb buffer=256k flush=5s;
    error_log  /var/log/nginx/console.example.org.error.log warn;

    # Session cookie and OAuth2 redirect only; the 8k default would do, this is headroom for a long Referer.
    large_client_header_buffers 4 16k;

    # The console only serves HTML/forms/static assets; uploads and WebSockets go browser -> api.example.org directly.
    client_max_body_size 16m;

    # Needed because the console runs with server.forward-headers-strategy=framework, so it can produce external https://console.example.org/... URLs.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503;

    # The console already produces the external scheme/host itself via the forwarded headers above.
    proxy_redirect off;

    location / {
        proxy_pass http://datahub_console;

        proxy_buffer_size        16k;
        proxy_buffers            16 16k;
        proxy_max_temp_file_size 0;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
